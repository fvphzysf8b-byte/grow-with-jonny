<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jonny">
<meta name="theme-color" content="#0f1412">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Grow with Jonny</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0f1412;--card:#171e1b;--card2:#1e2723;--line:#2a3530;--text:#eaf1ec;--muted:#93a59b;--faint:#5f7068;
  --accent:#7bd389;--accentInk:#0c1a10;--warn:#f2c14e;--danger:#ef6b6b;
  --r:16px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(100px + var(--sab));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 12px 10px;background:rgba(15,20,18,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.top.big .ttl{text-align:left;font-size:30px;padding-left:4px;line-height:1.1}
.top.big .sub{font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--accent);flex:none}
.ib:active{background:var(--card2)}
.wrap{padding:14px 14px 0;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.h2 button{color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px}
.row{display:flex;align-items:center;gap:10px}.grow1{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:rgba(15,20,18,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab))}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);padding:2px 0}
.tb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--accent)}
.tbplus{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accentInk);margin-top:-24px;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 4px var(--bg)}
.tbplus svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
summary{cursor:pointer;padding:12px 0;min-height:44px}
.garden-summary{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.garden-summary .small{display:block;margin-top:4px}
.tb{min-height:44px;color:var(--muted)}
/* tent cards */
.ecard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.ehead{display:flex;width:100%;text-align:left;align-items:center;gap:8px}
.ename{font-weight:700;font-size:18px}
.clim{margin-top:10px;font-size:14px}
.st{font-size:13px;font-weight:600}.st.ok{color:var(--accent)}.st.bad{color:var(--warn)}
.eqa{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.eqa::-webkit-scrollbar{display:none}
.eqa button{flex:1;white-space:nowrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 8px;font-size:13px;font-weight:600}
.pstrip{display:flex;gap:8px;overflow-x:auto;margin:12px -14px -2px;padding:0 14px 2px;scrollbar-width:none}
.pstrip::-webkit-scrollbar{display:none}
.pmini{width:84px;flex:none;text-align:center}
.pmini .pthumb{width:84px;height:84px;margin-bottom:4px}
.pmini.add .pthumb{border:1.5px dashed var(--faint);background:none;color:var(--muted)}
.pmname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmsub{font-size:11px;color:var(--muted)}
/* hero */
.hero{margin:-14px -14px 0;height:210px;position:relative;background:linear-gradient(135deg,#1d2b24,#12241a);display:grid;place-items:center;font-size:56px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(15,20,18,.95))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-34px;position:relative;z-index:2}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:20px;font-weight:600;font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
/* timeline */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 4px 8px}
.dayhead b{font-size:15px}.dayhead span{font-size:12px;color:var(--muted);text-align:right}
.entry{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.etop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.etime{font-weight:700;font-variant-numeric:tabular-nums}
.eicons{font-size:16px;letter-spacing:2px}
.eline{margin-top:6px;font-size:14px}
.eline .k{color:var(--muted)}
.enote{margin-top:8px;font-size:14px;color:var(--muted);white-space:pre-wrap}
.strip{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.strip img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--card2)}
/* plants */
.pcard{display:flex;width:100%;text-align:left;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
.pthumb{width:64px;height:64px;border-radius:14px;background:var(--card2);flex:none;display:grid;place-items:center;font-size:28px;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pname{font-weight:700}
.phasebar{display:flex;gap:3px;margin-top:12px}
.phasebar div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.phaselabels{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:4px}
/* gallery */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:14px -14px 0}
.gallery button{aspect-ratio:1;position:relative;overflow:hidden;background:var(--card2)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery span{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:600;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:8px}
/* charts */
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;margin-top:10px}
.chartcard h3{margin:0 0 8px;font-size:15px}
.chartbox{height:190px;position:relative}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
/* tasks */
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:6px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--accentInk)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.due{font-size:12px;color:var(--muted)}.due.late{color:var(--danger)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:11px;color:var(--faint);font-weight:600;padding-bottom:4px}
.cal button{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-variant-numeric:tabular-nums}
.cal button.today{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal button.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
.cal .dots{display:flex;gap:3px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
/* list rows */
.lrow{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);padding:14px;font-weight:500}
.lrow:first-child{border-radius:14px 14px 0 0}.lrow:last-child{border-radius:0 0 14px 14px}.lrow:only-child{border-radius:14px}
.lrow+.lrow{border-top:0}
.lrow .ico{font-size:20px;width:26px;text-align:center}
/* overlay sheet */
.overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.shead{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 12px 10px;border-bottom:1px solid var(--line)}
.shead b{flex:1;text-align:center}
.shead .btn{padding:8px 14px}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(40px + var(--sab))}
.sbody .in{max-width:640px;margin:0 auto}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:16px 2px 6px}
.lbl:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field span{display:block;font-size:12px;color:var(--muted);margin:0 2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:rgba(123,211,137,.16);border-color:var(--accent);color:var(--accent)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.act span{font-size:22px}
.act.on{border-color:var(--accent);background:rgba(123,211,137,.12);color:var(--accent)}
.sec{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px}
.sec.on{display:block}
.sec h4{margin:0 0 10px;font-size:15px}
.nrow{display:grid;grid-template-columns:1fr 66px 78px 30px;gap:6px;margin-bottom:6px}
.nrow select{padding-right:22px;background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%}
.vpd{margin-top:8px;font-size:14px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.photos .ph{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--card2)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);font-size:13px;display:grid;place-items:center}
.addph{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--faint);display:grid;place-items:center;font-size:26px;color:var(--muted);cursor:pointer}
.hrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.hrow input{width:100px}
/* dialogs */
.dlgbg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + var(--sab))}
.dlg{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;animation:up .18s ease}
.dlg p{margin:0 0 14px;text-align:center}
.dlg .btn{width:100%;margin-top:8px}
.menu .btn{justify-content:flex-start}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.pgrid button{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 2px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.pgrid button span{font-size:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sab));z-index:300;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.lb{position:fixed;inset:0;z-index:250;background:#000;display:flex;flex-direction:column}
.lb .imgw{flex:1;display:grid;place-items:center;overflow:hidden}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .bar{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) 12px 8px}
.lb .cap{flex:1;text-align:center;font-weight:600}
.empty{text-align:center;padding:32px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:8px}
.banner{background:rgba(242,193,78,.12);border:1px solid rgba(242,193,78,.4);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv .k{color:var(--muted)}
.plist{display:flex;gap:4px;flex-wrap:wrap}
.brand,.sbsync,.tbplus .pl{display:none}
.synccard{display:flex;gap:12px;align-items:center}
/* ===== Mac / Desktop ===== */
@media (min-width:900px){
 body{padding:0 0 40px 236px}
 .tabbar{top:0;bottom:0;right:auto;width:236px;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:calc(20px + var(--sat)) 14px 16px;border-top:0;border-right:1px solid var(--line);background:#121816}
 .brand{display:block;order:-2;font-weight:800;font-size:19px;padding:2px 10px 18px}
 .tbplus{order:-1;width:100%;height:46px;border-radius:12px;margin:0 0 14px;box-shadow:none;display:flex;gap:8px;font-weight:700;font-size:15px}
 .tbplus .pl{display:inline}.tbplus svg{width:20px;height:20px}
 .tb{flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;border-radius:12px}
 .tb svg{width:22px;height:22px}
 .tb.on{background:var(--card2)}.tb:hover{background:var(--card)}
 .sbsync{display:block;margin-top:auto;font-size:12px;color:var(--muted);padding:10px;line-height:1.35}
 .top{padding:18px 28px 14px}.top.big .ttl{font-size:34px}
 .wrap{max-width:1140px;padding:20px 28px 0}
 .hero{margin:-20px -28px 0;height:280px}
 .tabs{margin:18px 0 0;padding:0}
 .egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;align-items:start}
 .egrid .ecard{margin:0}
 .cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:0 10px}
 .gallery{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin:14px 0 0;gap:6px}
 .gallery button{border-radius:10px}
 .charts{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
 .chartbox{height:230px}
 .photos{grid-template-columns:repeat(6,1fr)}
 .nrow{grid-template-columns:1fr 100px 92px 30px}
 .tiles{grid-template-columns:repeat(4,1fr)}
 .calwrap{display:grid;grid-template-columns:minmax(360px,460px) 1fr;gap:32px;align-items:start}
 .calwrap>div:last-child .h2{margin-top:6px}
 .overlay{top:4vh;bottom:4vh;left:50%;right:auto;width:700px;margin-left:-350px;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
 body.modal:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
 .shead{padding:12px 14px}
 .dlgbg{align-items:center}
 .toast{bottom:30px;left:calc(50% + 118px)}
 .pcard:hover,.entry:hover,.lrow:hover,.ecard .ehead:hover .ename{border-color:#3a4a42;color:var(--text)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= Konstanten ================= */
const PHASES=[
 {k:'germination',l:'Keimung',c:'#c9a46a',i:'🫘'},
 {k:'seedling',l:'Sämling',c:'#9be08f',i:'🌱'},
 {k:'veg',l:'Wachstum',c:'#4fbf6b',i:'🌿'},
 {k:'flower',l:'Blüte',c:'#d68be0',i:'🌸'},
 {k:'drying',l:'Trocknung',c:'#e0a85a',i:'🍂'},
 {k:'curing',l:'Curing',c:'#b8875a',i:'🫙'}];
const PH=Object.fromEntries(PHASES.map(p=>[p.k,p]));
const ACTS=[
 {k:'water',l:'Gießen',i:'💧'},{k:'feed',l:'Düngen',i:'🧪'},{k:'env',l:'Klima',i:'🌡️'},{k:'train',l:'Training',i:'✂️'},
 {k:'transplant',l:'Umtopfen',i:'🪴'},{k:'measure',l:'Messen',i:'📏'},{k:'problem',l:'Problem',i:'🐛'},{k:'phase',l:'Phase',i:'🔄'}];
const ACTI={...Object.fromEntries(ACTS.map(a=>[a.k,a])),harvest:{k:'harvest',l:'Ernte',i:'⚖️'}};
const TRAININGS=['Topping','FIM','LST','HST','Supercropping','Entlauben','Lollipopping','SCROG','Mainlining','Stecklinge genommen','Spülen'];
const PROBLEMS=['Stickstoffmangel','Kaliummangel','Magnesiummangel','Calciummangel','Überdüngung','Überwässerung','Unterwässerung','Lichtstress','Hitzestress','Spinnmilben','Thripse','Trauermücken','Blattläuse','Mehltau','Schimmel / Botrytis','Wurzelfäule','pH-Problem'];
const LIGHTS=['LED','HPS / NDL','CMH / LEC','Leuchtstoff / CFL','Gemischt'];
const MEDIA=['Erde','Living Soil','Coco','Hydro (DWC)','Steinwolle','Sonstiges'];
const SCHEDULES=['18/6','20/4','24/0','12/12','11/13'];
const PTYPES=['Feminisiert (photo)','Autoflower','Regulär','Steckling / Klon'];
const REPEATS=[[0,'Nie'],[1,'Täglich'],[2,'Alle 2 Tage'],[3,'Alle 3 Tage'],[7,'Wöchentlich'],[14,'Alle 2 Wochen']];
const SERIES=['#3987e5','#d95926','#199e70','#c98500','#d55181','#0ca30c','#9085e9','#e66767'];
/* Zielwerte je Phase: Temperatur °C, rel. Luftfeuchte %, VPD kPa */
const TARGET={germination:{t:[22,26],h:[65,80],v:[.4,.8]},seedling:{t:[22,26],h:[65,75],v:[.4,.8]},veg:{t:[22,28],h:[55,70],v:[.8,1.2]},flower:{t:[20,26],h:[40,55],v:[1.2,1.6]},drying:{t:[15,21],h:[55,65]}};
const IC={
 home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>',
 leaf:'<svg viewBox="0 0 24 24"><path d="M5 20c0-9 6-15 15-15 0 9-6 15-15 15z"/><path d="M5 20l7.5-7.5"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
 more:'<svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'};

/* ================= Helfer ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const z2=n=>String(n).padStart(2,'0');
const ymd=(d=new Date())=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const nowTime=()=>{const d=new Date();return z2(d.getHours())+':'+z2(d.getMinutes())};
const nowLocal=()=>ymd()+'T'+nowTime();
const utc=s=>{const[y,m,d]=s.slice(0,10).split('-').map(Number);return Date.UTC(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((utc(b)-utc(a))/864e5);
const addDays=(s,n)=>new Date(utc(s)+n*864e5).toISOString().slice(0,10);
const fmtDay=s=>new Date(s.slice(0,10)+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short',year:s.slice(0,4)==String(new Date().getFullYear())?undefined:'numeric'});
const fmtShort=s=>new Date(s.slice(0,10)+'T12:00').toLocaleDateString('de-DE',{day:'numeric',month:'short'});
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmtN=(n,d=1)=>n==null?'–':(Math.round(n*10**d)/10**d).toLocaleString('de-DE');
const ago=s=>{const d=dayDiff(s,ymd());return d<=0?'heute':d==1?'gestern':'vor '+d+' Tagen'};
const agoT=s=>s.slice(0,10)===ymd()?'heute '+s.slice(11,16):ago(s);
const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','de',{numeric:true});
const byDate=(a,b)=>b.date.localeCompare(a.date);
const nf=(n,l,v,ph='')=>`<label class="field"><span>${l}</span><input name="${n}" type="number" inputmode="decimal" step="any" value="${v??''}" placeholder="${ph}"></label>`;

/* ================= Speicher (IndexedDB, nur auf dem Gerät) ================= */
const mem={items:new Map(),photos:new Map()},outbox=new Map();let idb=null,storeOK=false;
function openDB(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('growbuch',2)}catch(e){return rej(e)}
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');if(!d.objectStoreNames.contains('outbox'))d.createObjectStore('outbox',{keyPath:'key'})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function req(store,mode,op){return new Promise((res,rej)=>{if(!idb)return res(undefined);try{const r=op(idb.transaction(store,mode).objectStore(store));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function initStore(){
 try{idb=await openDB();const a=await req('items','readonly',s=>s.getAll());(a||[]).forEach(o=>mem.items.set(o.id,o));const ob=await req('outbox','readonly',s=>s.getAll());(ob||[]).forEach(o=>outbox.set(o.key,o));storeOK=true;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 }catch(e){idb=null;storeOK=false}
}
const saveErr=e=>toast('Speichern fehlgeschlagen'+(e&&e.name==='QuotaExceededError'?': Speicher voll':''));
function localPut(o){if(!o||!o.id)return;mem.items.set(o.id,o);return req('items','readwrite',s=>s.put(o)).catch(saveErr)}
function localDel(id){mem.items.delete(id);return req('items','readwrite',s=>s.delete(id)).catch(saveErr)}
/* Jede Änderung kommt in die Outbox und wird beim nächsten Sync hochgeladen */
function enqueue(op){op.v=Date.now()+Math.random();outbox.set(op.key,op);req('outbox','readwrite',s=>s.put(op)).catch(()=>{});scheduleSync()}
function put(o){o.updated=Date.now();const r=localPut(o);enqueue({key:'i:'+o.id,k:'i',id:o.id});return r}
function del(id){const o=mem.items.get(id);const r=localDel(id);enqueue({key:'i:'+id,k:'i',id,del:true,type:o?o.type:'x'});return r}
async function putPhoto(blob,id=uid()){mem.photos.set(id,blob);await req('photos','readwrite',s=>s.put(blob,id)).catch(saveErr);enqueue({key:'p:'+id,k:'p',id});return id}
function delPhoto(id){mem.photos.delete(id);const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}enqueue({key:'p:'+id,k:'p',id,del:true});return req('photos','readwrite',s=>s.delete(id)).catch(()=>{})}
async function getPhoto(id){let b=mem.photos.get(id);if(!b){b=await req('photos','readonly',s=>s.get(id)).catch(()=>null);if(b)mem.photos.set(id,b)}if(!b)b=await cloudPhoto(id);return b}
const urlCache=new Map();
async function photoURL(id){if(urlCache.has(id))return urlCache.get(id);const b=await getPhoto(id);if(!b)return'';const u=URL.createObjectURL(b);urlCache.set(id,u);return u}
function hydrate(root=document){$$('img[data-ph]',root).forEach(async im=>{const u=await photoURL(im.dataset.ph);if(u)im.src=u;else im.remove()})}
const img=(id,attrs='')=>id?`<img data-ph="${esc(id)}" alt="" ${attrs}>`:'';
function shrink(file,max=1600,q=.82){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Bild')),'image/jpeg',q)};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Bild konnte nicht gelesen werden'))};im.src=u})}
/* Daten aus der ersten Version (Grows) übernehmen */
function migrate(){for(const o of [...mem.items.values()]){
 if(o.type==='grow'){o.type='env';o.kind='grow';o.size=o.size||o.space||'';put(o)}
 else if(o.type==='entry'){o.type='log';o.envId=o.growId;o.acts=(o.acts||[]).map(a=>a==='training'?'train':a);put(o)}
 else if((o.type==='plant'||o.type==='task')&&o.growId&&o.envId===undefined){o.envId=o.growId;if(o.type==='plant'&&o.phases&&o.phases.done)o.archived=true;put(o)}}}

/* ================= Datenzugriff ================= */
const all=t=>[...mem.items.values()].filter(o=>o.type===t);
const get=id=>id?mem.items.get(id):undefined;
const envs=()=>all('env').sort((a,b)=>(a.kind==='dry')-(b.kind==='dry')||(a.order??0)-(b.order??0)||byName(a,b));
const dryEnvs=()=>envs().filter(e=>e.kind==='dry');
const activePlants=()=>all('plant').filter(p=>!p.archived);
const plantsIn=id=>activePlants().filter(p=>p.envId===id).sort(byName);
const jarPlants=()=>activePlants().filter(p=>!p.envId).sort(byName);
const logsOfEnv=id=>all('log').filter(l=>l.envId===id).sort(byDate);
const logsOfPlant=id=>all('log').filter(l=>(l.plantIds||[]).includes(id)).sort(byDate);
const mixes=()=>all('mix').sort(byName);
function plantStart(p){const ds=Object.values(p.phases||{}).filter(Boolean).sort();return ds[0]||(p.created||ymd()).slice(0,10)}
function phaseAt(p,d){let cur=null;for(const x of PHASES)if(p.phases&&p.phases[x.k]&&p.phases[x.k]<=d)cur=x;if(cur)return cur;for(const x of PHASES)if(p.phases&&p.phases[x.k])return x;return PHASES[0]}
const curPhase=p=>phaseAt(p,ymd());
function ageAt(p,d=ymd()){const end=p.archived&&p.phases&&p.phases.done&&p.phases.done<d?p.phases.done:d;const start=plantStart(p),ph=phaseAt(p,end);
 const stop=p.phases&&p.phases.drying&&p.phases.drying<=end?p.phases.drying:end;const age=Math.max(0,dayDiff(start,stop))+1;const pd=Math.max(0,dayDiff((p.phases&&p.phases[ph.k])||start,end))+1;
 return{age,week:Math.ceil(age/7),ph,pday:pd,pweek:Math.ceil(pd/7)}}
const lastLog=(p,act)=>logsOfPlant(p.id).find(l=>(l.acts||[]).includes(act));
function photosOf(list){const out=[];list.forEach(l=>(l.photos||[]).forEach(id=>out.push({id,date:l.date})));return out}
function plantCover(pid){const l=logsOfPlant(pid).find(l=>l.photos&&l.photos.length);return l?l.photos[0]:null}
function envCover(eid){const l=logsOfEnv(eid).find(l=>l.photos&&l.photos.length);return l?l.photos[0]:null}
function vpd(t,rh){if(t==null||rh==null)return null;const svp=x=>.6108*Math.exp(17.27*x/(x+237.3));return Math.max(0,svp(t-2)-svp(t)*rh/100)}
function nutrientNames(){const s=new Set();all('log').forEach(l=>(l.nutrients||[]).forEach(n=>n.name&&s.add(n.name)));mixes().forEach(m=>(m.items||[]).forEach(n=>n.name&&s.add(n.name)));return[...s].sort()}
function envPhase(e){if(e.kind==='dry')return'drying';const c={};plantsIn(e.id).forEach(p=>{const k=curPhase(p).k;if(k==='drying'||k==='curing')return;c[k]=(c[k]||0)+1});let b=null;for(const k in c)if(!b||c[k]>c[b])b=k;return b}
function climateCheck(t,h,phase){const tg=TARGET[phase],v=vpd(t,h),iss=[];if(!tg)return{tg,v,iss};
 if(t!=null){if(t<tg.t[0])iss.push('zu kalt');else if(t>tg.t[1])iss.push('zu warm')}
 if(h!=null){if(h<tg.h[0])iss.push('RLF zu niedrig');else if(h>tg.h[1])iss.push('RLF zu hoch')}
 if(tg.v&&v!=null&&!iss.length){if(v<tg.v[0])iss.push('VPD niedrig');else if(v>tg.v[1])iss.push('VPD hoch')}return{tg,v,iss}}
function lastClimate(e){return logsOfEnv(e.id).find(l=>l.env&&(l.env.temp!=null||l.env.rh!=null))}
function statusHTML(t,h,phase){const c=climateCheck(t,h,phase);if(!c.tg)return'';return c.iss.length?`<span class="st bad">⚠︎ ${c.iss.join(', ')}</span>`:`<span class="st ok">✓ Im Zielbereich (${PH[phase].l})</span>`}
function targetText(phase){const tg=TARGET[phase];if(!tg)return'';return `Ziel ${PH[phase].l}: ${tg.t[0]}–${tg.t[1]} °C · ${tg.h[0]}–${tg.h[1]} %${tg.v?' · VPD '+fmtN(tg.v[0])+'–'+fmtN(tg.v[1]):''}`}
function climLine(e){const l=lastClimate(e);if(!l)return `<div class="clim muted">🌡️ Noch kein Klima eingetragen</div>`;
 const t=l.env.temp,h=l.env.rh,v=vpd(t,h);const parts=[t!=null?fmtN(t)+' °C':null,h!=null?fmtN(h,0)+' %':null,v!=null&&e.kind!=='dry'?'VPD '+fmtN(v,2):null].filter(Boolean).join(' · ');
 const st=statusHTML(t,h,envPhase(e));return `<div class="clim">🌡️ <b>${parts}</b> <span class="muted small">${agoT(l.date)}</span>${st?'<br>'+st:''}</div>`}

/* ================= Navigation ================= */
const ROOTS=['today','garden','cal','more'];
let R={v:'today'},stack=[];
function tab(v){stack=[];R={v};render();window.scrollTo(0,0)}
function go(r){stack.push(R);R=r;render();window.scrollTo(0,0)}
function back(){R=stack.pop()||{v:'today'};render()}
const rootOf=()=>ROOTS.includes(R.v)?R.v:((stack.find(s=>ROOTS.includes(s.v))||{v:'garden'}).v);
const charts=[];
function render(){
 charts.splice(0).forEach(c=>{try{c.destroy()}catch(e){}});window._cd=null;
 if((R.v==='env'||R.v==='plant')&&!get(R.id))R=stack.pop()||{v:'today'};
 const V={today:vToday,garden:vGarden,cal:vCal,more:vMore,env:vEnv,plant:vPlant,mixes:vMixes,archive:vArchive}[R.v]||vToday;
 const app=$('#app');app.innerHTML=V()+tabbar();hydrate(app);
 if(R.after){const f=R.after;R.after=null;f()}
 if(window._cd)drawCharts();
}
function tabbar(){const r=rootOf(),T=(k,l,svg)=>`<button class="tb ${r===k?'on':''}" ${r===k?'aria-current="page"':''} onclick="tab('${k}')">${svg}<span>${l}</span></button>`;
 return `<nav class="tabbar"><div class="brand">🌱 Grow with Jonny</div>${T('today','Heute',IC.home)}${T('garden','Garten',IC.leaf)}<button class="tbplus" onclick="plusMenu()" aria-label="Neuer Eintrag">${IC.plus}<span class="pl">Neuer Eintrag</span></button>${T('cal','Kalender',IC.cal)}${T('more','Einstellungen',IC.more)}<div class="sbsync" data-sync>${syncText()}</div></nav>`}
const head=(title,menu)=>`<header class="top"><button class="ib" onclick="back()" aria-label="Zurück">‹</button><div class="ttl">${esc(title)}</div>${menu?`<button class="ib" onclick="${menu}" aria-label="Menü">⋯</button>`:'<span class="ib"></span>'}</header>`;
const bighead=(title,sub,right='')=>`<header class="top big"><div class="ttl">${title}${sub?`<div class="sub">${sub}</div>`:''}</div>${right}</header>`;
const tabs=(list,on)=>`<div class="tabs">${list.map(([k,l])=>`<button class="tab ${k==on?'on':''}" onclick="R.tab='${k}';render()">${l}</button>`).join('')}</div>`;
function ctx(){if(R.v==='env')return{envId:R.id};if(R.v==='plant'){const p=get(R.id);return{envId:p.envId,plantIds:[p.id]}}return{}}

/* ================= Heute ================= */
function vToday(){
 const es=envs();const open=all('task').filter(t=>!t.done);
 const due=open.filter(t=>!t.due||t.due<=ymd()).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
 const soon=open.filter(t=>t.due&&t.due>ymd()&&t.due<=addDays(ymd(),3)).sort((a,b)=>a.due.localeCompare(b.due));
 const recent=all('log').sort(byDate).slice(0,3);
 let h=bighead('Heute',new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'}))+`<div class="wrap">`;
 if(!storeOK)h+=`<div class="banner">Speichern ist in dieser Ansicht nicht möglich. Öffne die App in Safari und lege sie auf den Home-Bildschirm.</div>`;
 if(!es.length)return h+setupCard()+`</div>`;
 h+=`<div class="h2">Aufgaben<button onclick="editTask()">+ Erinnerung</button></div>`;
 h+=due.length?due.map(taskRow).join(''):`<div class="card muted small">✓ Heute ist nichts fällig.</div>`;
 if(soon.length)h+=`<div class="muted small" style="margin:10px 4px 6px">Demnächst</div>`+soon.map(taskRow).join('');
 h+=`<div class="h2">Mein Garten<button onclick="tab('garden')">Alle ansehen ›</button></div><button class="card garden-summary" onclick="tab('garden')"><span>🌱 <b>${activePlants().length} Pflanzen</b><span class="muted small">${es.length} Zelte · Pflanzen und Standorte öffnen</span></span><span>›</span></button><button class="btn primary block" style="margin-top:12px" onclick="plusMenu()">＋ Eintrag hinzufügen</button>`;
 const jars=jarPlants();if(jars.length)h+=`<div class="card small">🫙 <b>${jars.length}</b> im Glas (Curing) · <button style="color:var(--accent)" onclick="tab('garden')">ansehen</button></div>`;
 if(recent.length)h+=`<div class="h2">Zuletzt</div>`+timeline(recent,'all');
 return h+`</div>`}
function setupCard(){return `<div class="card" style="text-align:center;margin-top:10px"><div style="font-size:38px">🌱</div><h2>Dein Garten beginnt hier</h2><p class="muted small">Lege zuerst ein Zelt an. Danach fügst du deine Pflanzen hinzu und hältst Fotos und Beobachtungen im Tagebuch fest.</p><button class="btn primary block" onclick="editEnv()">Erstes Zelt anlegen</button><details style="margin-top:16px"><summary class="muted small">Mehrere Zelte auf einmal</summary><p class="small muted">Für ein größeres Setup mit drei Growzelten und einem Trockenzelt.</p><button class="btn block" onclick="quickSetup()">3 Zelte + Trockenzelt anlegen</button></details></div>`}
function quickSetup(){const t=new Date().toISOString();['Zelt 1','Zelt 2','Zelt 3'].forEach((n,i)=>put({id:uid(),type:'env',kind:'grow',name:n,schedule:'18/6',order:i,created:t}));
 put({id:uid(),type:'env',kind:'dry',name:'Trockenzelt',order:9,created:t});toast('Setup angelegt – jetzt Pflanzen hinzufügen');tab('garden')}

/* ================= Garten ================= */
function vGarden(){const es=envs(),ps=activePlants(),mode=R.tab||'plants';
 let h=bighead('Garten',`${ps.length} Pflanzen · ${es.length} Zelte`)+`<div class="wrap">`;
 if(!es.length&&!ps.length)return h+setupCard()+`</div>`;
 h+=tabs([['plants','Pflanzen'],['envs','Zelte']],mode);
 if(mode==='plants'){
 h+=`<div class="row" style="margin:14px 0"><button class="btn primary grow1" onclick="${es.some(e=>e.kind!=='dry')?'editPlant()':'editEnv()'}">＋ ${es.some(e=>e.kind!=='dry')?'Pflanze hinzufügen':'Zelt anlegen'}</button><button class="btn" onclick="go({v:'archive'})">Archiv</button></div><label class="small muted" for="plant-search">Pflanze oder Sorte suchen</label><input id="plant-search" type="search" placeholder="Name oder Sorte eingeben" value="${esc(R.query||'')}" oninput="R.query=this.value;filterGarden()" style="margin:6px 0 14px"><div id="garden-plants"></div>`;
 R.after=filterGarden;
 }else{
 h+=`<p class="muted small">Öffne ein Zelt für Pflanzen, Tagebuch und Klima.</p><div class="egrid">`+es.map(e=>envCard(e,true)).join('')+`</div><button class="btn block" style="margin-top:12px" onclick="editEnv()">＋ Zelt hinzufügen</button>`;
 }
 return h+`</div>`}
function filterGarden(){const box=$('#garden-plants');if(!box)return;const q=(R.query||'').trim().toLocaleLowerCase('de');
 const ps=activePlants().sort(byName).filter(p=>[p.name,p.strain].some(v=>(v||'').toLocaleLowerCase('de').includes(q)));
 box.innerHTML=ps.length?ps.map(plantCard).join(''):`<div class="card muted small">${q?'Keine passende Pflanze gefunden. Ändere deinen Suchbegriff.':'Noch keine Pflanzen. Füge deine erste Pflanze hinzu.'}</div>`;hydrate(box)}

function phasePills(ps){const c={},d={};ps.forEach(p=>{const a=ageAt(p),k=a.ph.k;c[k]=(c[k]||0)+1;d[k]=Math.max(d[k]||0,a.pday)});
 return PHASES.filter(x=>c[x.k]).map(x=>`<span class="pill"><i style="background:${x.c}"></i>${c[x.k]}× ${x.l} · T${d[x.k]}</span>`).join('')}
function envMeta(e){const dry=e.kind==='dry';return[dry&&!/trocken/i.test(e.name||'')?'Trockenzelt':null,e.size,!dry&&e.schedule?'☀️ '+e.schedule:null,e.light?e.light+(e.watt?' '+e.watt+' W':''):null,e.medium].filter(Boolean).map(esc).join(' · ')}
function envQuick(e){const dry=e.kind==='dry';return `<div class="eqa">${dry?'':`<button onclick="editLog({envId:'${e.id}',acts:['water']})">💧 Gießen</button><button onclick="editLog({envId:'${e.id}',acts:['feed']})">🧪 Düngen</button>`}<button onclick="quickClimate('${e.id}')">🌡️ Klima</button><button onclick="editLog({envId:'${e.id}',acts:['photo']})">📷 Foto</button>${dry?`<button onclick="editLog({envId:'${e.id}'})">📝 Notiz</button>`:''}</div>`}
function envCard(e,full){const ps=plantsIn(e.id),dry=e.kind==='dry';
 let h=`<div class="ecard"><button class="ehead" onclick="go({v:'env',id:'${e.id}',tab:'plants'})"><div class="grow1"><div class="ename">${dry?'🍂':'⛺'} ${esc(e.name)}</div><div class="muted small">${envMeta(e)||'Tippen zum Einrichten'}</div></div><span class="muted">›</span></button>
 <div class="pills">${phasePills(ps)}${ps.length?'':`<span class="pill">${dry?'Leer':'Keine Pflanzen'}</span>`}</div>${climLine(e)}${envQuick(e)}`;
 if(full&&(ps.length||!dry))h+=`<div class="pstrip">${ps.map(plantMini).join('')}${dry?'':`<button class="pmini add" onclick="editPlant(null,'${e.id}')"><div class="pthumb">＋</div><div class="pmname">Pflanze</div></button>`}</div>`;
 return h+`</div>`}
function plantMini(p){const a=ageAt(p),cov=plantCover(p.id);

/* ================= Tagebuch-Ansichten ================= */
function timeline(ls,cx,p){
 if(!ls.length)return `<div class="empty"><div class="big">📓</div>Noch keine Einträge. Tippe unten auf ＋.</div>`;
 let h='',last='';
 ls.forEach(l=>{const d=l.date.slice(0,10);if(d!==last){last=d;let right='';if(p&&d>=plantStart(p)){const a=ageAt(p,d);right=`Tag ${a.age} · ${a.ph.i} ${a.ph.l} T${a.pday}`}h+=`<div class="dayhead"><b>${fmtDay(d)}</b><span>${right}</span></div>`}h+=logCard(l,cx)});
 return h}
function logLines(l){const L=[],k=a=>`<span class="k">${a}</span>`;
 if(l.water){const w=l.water,p=[];if(w.amount!=null)p.push(fmtN(w.amount,2)+' L'+((l.plantIds||[]).length>1?' je Pflanze':''));if(w.ph!=null)p.push('pH '+fmtN(w.ph,2));if(w.ec!=null)p.push('EC '+fmtN(w.ec,2));
  if(w.rph!=null||w.rec!=null)p.push(k('Runoff')+' '+[w.rph!=null?'pH '+fmtN(w.rph,2):'',w.rec!=null?'EC '+fmtN(w.rec,2):''].filter(Boolean).join(' '));L.push('💧 '+(p.join(' · ')||'Gegossen'))}
 if(l.nutrients&&l.nutrients.length)L.push('🧪 '+(l.mixName?`<b>${esc(l.mixName)}</b>: `:'')+l.nutrients.map(n=>esc(n.name)+(n.dose!=null?' '+k(fmtN(n.dose,2)+' '+(n.unit||'ml/L')):'')).join(', '));
 if(l.env){const v=l.env,p=[];if(v.temp!=null)p.push(fmtN(v.temp)+' °C');if(v.rh!=null)p.push(fmtN(v.rh,0)+' % RLF');const vp=vpd(v.temp,v.rh);if(vp!=null)p.push('VPD '+fmtN(vp,2));if(v.ppfd!=null)p.push(fmtN(v.ppfd,0)+' PPFD');if(v.co2!=null)p.push(fmtN(v.co2,0)+' ppm CO₂');if(p.length)L.push('🌡️ '+p.join(' · '))}
 if(l.height!=null)L.push('📏 Höhe '+fmtN(l.height)+' cm');
 if(l.pot)L.push('🪴 Umgetopft in '+esc(l.pot));
 if(l.training&&l.training.length)L.push('✂️ '+l.training.map(esc).join(', '));
 if(l.phase)L.push('🔄 Phase → <b>'+(PH[l.phase]?PH[l.phase].i+' '+PH[l.phase].l:esc(l.phase))+'</b>');
 if(l.problems&&l.problems.length)L.push('🐛 '+l.problems.map(esc).join(', '));
 if(l.harvest){const p=[];if(l.harvest.wet)p.push('nass '+fmtN(l.harvest.wet,0)+' g');if(l.harvest.dry)p.push('trocken '+fmtN(l.harvest.dry,0)+' g');if(p.length)L.push('⚖️ '+p.join(' · '))}
 return L}
function logCard(l,cx){const e=get(l.envId),ps=(l.plantIds||[]).map(get).filter(Boolean);const who=[];
 if(cx==='all'&&e)who.push(`<span class="pill">${esc(e.name)}</span>`);
 if(cx!=='plant'){if(ps.length>3)who.push(`<span class="pill">${ps.length} Pflanzen</span>`);else ps.forEach(p=>who.push(`<span class="pill">${esc(p.name)}</span>`))}
 const icons=(l.acts||[]).map(a=>ACTI[a]?ACTI[a].i:'').join('')+((l.photos||[]).length?'📷':'')+(l.note?'📝':'');
 return `<button class="entry" onclick="editLog(get('${l.id}'))"><div class="etop"><span class="etime">${l.date.slice(11,16)}</span><span class="eicons">${icons}</span><span class="grow1"></span><span class="plist">${who.join('')}</span></div>
 ${logLines(l).map(x=>`<div class="eline">${x}</div>`).join('')}${l.note?`<div class="enote">${esc(l.note)}</div>`:''}${(l.photos||[]).length?`<div class="strip">${l.photos.map(id=>img(id)).join('')}</div>`:''}</button>`}
function gallery(list,p){if(!list.length)return `<div class="empty"><div class="big">📷</div>Noch keine Fotos.</div>`;
 window._lb=list.map(x=>({id:x.id,cap:fmtDay(x.date)+(p&&x.date.slice(0,10)>=plantStart(p)?' · Tag '+ageAt(p,x.date.slice(0,10)).age:'')}));
 return `<div class="gallery">${list.map((x,i)=>`<button onclick="lightbox(window._lb,${i})">${img(x.id,'loading="lazy"')}<span>${p&&x.date.slice(0,10)>=plantStart(p)?'T'+ageAt(p,x.date.slice(0,10)).age:fmtShort(x.date)}</span></button>`).join('')}</div>`}

const X=l=>(utc(l.date)+(Number(l.date.slice(11,13))||0)*36e5+(Number(l.date.slice(14,16))||0)*6e4)/864e5;
function envChartDefs(e){const ls=logsOfEnv(e.id).slice().reverse().filter(l=>l.env);const s=(f)=>ls.map(l=>({x:X(l),y:f(l)})).filter(p=>p.y!=null);
 const d=[{title:'Temperatur (°C)',unit:'°C',sets:[{label:'Temperatur',data:s(l=>l.env.temp)}]},{title:'Luftfeuchte (% RLF)',unit:'%',sets:[{label:'RLF',data:s(l=>l.env.rh)}]}];
 if(e.kind!=='dry')d.push({title:'VPD (kPa)',unit:'kPa',sets:[{label:'VPD',data:s(l=>vpd(l.env.temp,l.env.rh))}]});return d}
function plantChartDefs(p,ls){const a=ls.slice().reverse(),s=f=>a.map(l=>({x:X(l),y:f(l)})).filter(q=>q.y!=null);
 return[{title:'pH',unit:'',sets:[{label:'Gießwasser',data:s(l=>l.water&&l.water.ph)},{label:'Runoff',data:s(l=>l.water&&l.water.rph)}]},
  {title:'EC (mS/cm)',unit:'mS/cm',sets:[{label:'Gießwasser',data:s(l=>l.water&&l.water.ec)},{label:'Runoff',data:s(l=>l.water&&l.water.rec)}]},
  {title:'Höhe (cm)',unit:'cm',sets:[{label:'Höhe',data:s(l=>l.height)}]},
  {title:'Wasser pro Gießen (L)',unit:'L',type:'bar',sets:[{label:'Wasser',data:s(l=>l.water&&l.water.amount)}]}]}

function chartSection(defs){defs=defs.map(d=>({...d,sets:d.sets.filter(s=>s.data.length)})).filter(d=>d.sets.length);
 if(!defs.length)return `<div class="empty">Sobald du Werte einträgst, erscheinen hier die Verläufe.</div>`;

function drawCharts(){if(!window.Chart||!window._cd)return;const muted='#93a59b',text='#eaf1ec',grid='rgba(255,255,255,.06)';
 const dl=v=>new Date(Math.floor(v)*864e5).toLocaleDateString('de-DE',{day:'numeric',month:'numeric',timeZone:'UTC'});

  charts.push(new Chart(cv,{type,data:{datasets:d.sets.map((s,j)=>({label:s.label,data:s.data,borderColor:SERIES[j],backgroundColor:SERIES[j],pointBackgroundColor:SERIES[j],pointBorderColor:'#171e1b',pointBorderWidth:2,borderWidth:2,tension:.25,pointRadius:4,pointHoverRadius:7,borderRadius:4,barThickness:8}))},
  options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'nearest',intersect:false},
   scales:{x:{type:'linear',ticks:{color:muted,maxTicksLimit:6,callback:dl},grid:{color:grid},border:{color:grid}},y:{ticks:{color:muted},grid:{color:grid},border:{display:false},beginAtZero:type==='bar'}},
   plugins:{legend:{display:d.sets.length>1,labels:{color:text,usePointStyle:true,boxWidth:8,boxHeight:8}},tooltip:{backgroundColor:'#0b0f0d',borderColor:'#2a3530',borderWidth:1,titleColor:text,bodyColor:text,callbacks:{title:it=>dl(it[0].parsed.x),label:it=>`${it.dataset.label}: ${fmtN(it.parsed.y,2)} ${d.unit}`}}}}}))})}

/* ================= Kalender ================= */
function vCal(){const m=R.month||ymd().slice(0,7),sel=R.sel||ymd();const[y,mo]=m.split('-').map(Number);
 const startDow=(new Date(y,mo-1,1).getDay()+6)%7,days=new Date(y,mo,0).getDate();
 const logs={},tasks={};all('log').forEach(l=>{const d=l.date.slice(0,10);logs[d]=(logs[d]||0)+1});all('task').forEach(t=>{if(t.due&&!t.done)tasks[t.due]=(tasks[t.due]||0)+1});
 let g=['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="dow">${d}</div>`).join('')+'<div></div>'.repeat(startDow);
 for(let d=1;d<=days;d++){const ds=m+'-'+z2(d);g+=`<button class="${ds===ymd()?'today':''} ${ds===sel?'sel':''}" onclick="R.sel='${ds}';render()">${d}<span class="dots">${logs[ds]?'<i style="background:#7bd389"></i>':''}${tasks[ds]?'<i style="background:#f2c14e"></i>':''}</span></button>`}
 const tl=all('task').filter(t=>t.due===sel).sort((a,b)=>a.done-b.done),ll=all('log').filter(l=>l.date.slice(0,10)===sel).sort(byDate);
 const title=new Date(y,mo-1,15).toLocaleDateString('de-DE',{month:'long',year:'numeric'});
 let h=bighead('Kalender','',`<button class="ib" onclick="editTask(null,null,'${sel}')" aria-label="Erinnerung">＋</button>`)+`<div class="wrap"><div class="calwrap"><div><div class="calhead"><button class="ib" onclick="calMove(-1)">‹</button><b>${title}</b><button class="ib" onclick="calMove(1)">›</button></div><div class="cal">${g}</div>
 <div class="muted tiny" style="margin:8px 4px">🟢 Einträge · 🟡 Erinnerungen</div></div>
 <div><div class="h2">${fmtDay(sel)}<button onclick="editTask(null,null,'${sel}')">+ Erinnerung</button></div>`;
 if(!tl.length&&!ll.length)h+=`<div class="card muted small">Nichts an diesem Tag.</div>`;
 h+=tl.map(taskRow).join('');if(ll.length)h+=ll.map(l=>logCard(l,'all')).join('');

function calMove(n){const m=R.month||ymd().slice(0,7);let[y,mo]=m.split('-').map(Number);mo+=n;if(mo<1){mo=12;y--}if(mo>12){mo=1;y++}R.month=y+'-'+z2(mo);R.sel=R.month+'-01';render()}

function dueLabel(t){if(!t.due)return'Ohne Datum';const d=dayDiff(ymd(),t.due);return d<0&&!t.done?'Überfällig · '+fmtDay(t.due):d===0?'Heute':d===1?'Morgen':fmtDay(t.due)}
function taskRow(t){const late=t.due&&t.due<ymd()&&!t.done,e=get(t.envId),rep=REPEATS.find(r=>r[0]===t.repeat);
 return `<div class="task ${t.done?'done':''}"><button class="chk ${t.done?'on':''}" onclick="toggleTask('${t.id}')" aria-label="Erledigt">${t.done?'✓':''}</button><button class="grow1" style="text-align:left" onclick="editTask(get('${t.id}'))"><div class="tt">${esc(t.title)}</div><div class="due ${late?'late':''}">${dueLabel(t)}${e?' · '+esc(e.name):''}${t.repeat?' · 🔁 '+(rep?rep[1]:''):''}</div></button></div>`}
function toggleTask(id){const t=get(id);t.done=!t.done;
 if(t.done&&t.repeat&&!t.nextId){const n={...t,id:uid(),done:false,due:addDays(t.due||ymd(),t.repeat)};delete n.nextId;t.nextId=n.id;put(n);toast('Erledigt · nächste am '+fmtShort(n.due))}
 else if(!t.done&&t.nextId){const n=get(t.nextId);if(n&&!n.done)del(n.id);t.nextId=null}
 put(t);render()}

 <div class="lbl">Was?</div><input name="title" value="${esc(t?t.title:'')}" placeholder="z. B. Gießen, Wasser ansetzen…">
 <div class="chips" style="margin-top:8px">${['💧 Gießen','🧪 Düngen','🌡️ Klima prüfen','🪣 Wasser ansetzen','✂️ Entlauben','🔍 Schädlingskontrolle'].map(s=>`<button class="chip" data-sug="${s}">${s}</button>`).join('')}</div>

 <div class="grid2" style="margin-top:12px"><label class="field"><span>Datum</span><input type="date" name="due" value="${t?t.due||'':due||ymd()}"></label><label class="field"><span>Wiederholen</span><select name="rep">${REPEATS.map(([v,l])=>`<option value="${v}" ${(t?t.repeat||0:0)===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
 ${t?`<button class="btn danger block" style="margin-top:20px" data-del>Erinnerung löschen</button>`:''}</div></div>`);
 const ti=$('[name=title]',o);$$('[data-sug]',o).forEach(b=>b.onclick=()=>{ti.value=b.dataset.sug});if(!t)setTimeout(()=>ti.focus(),250);
 const d=$('[data-del]',o);if(d)d.onclick=()=>{del(t.id);closeOverlay(o);render()};
 $('[data-s]',o).onclick=()=>{const title=ti.value.trim();if(!title){toast('Bitte einen Titel eingeben');return}
  const x=t||{id:uid(),type:'task',done:false,created:new Date().toISOString()};Object.assign(x,{title,envId:$('[name=env]',o).value||null,due:$('[name=due]',o).value||null,repeat:Number($('[name=rep]',o).value)});
  put(x);closeOverlay(o);render();toast('Gespeichert')}}

/* ================= Formulare: Zelt & Pflanze ================= */
function field(f,v){const val=v??f.d??'';
 if(f.t==='select')return `<label class="field"><span>${f.l}</span><select name="${f.n}">${f.noEmpty?'':'<option value="">–</option>'}${f.o.map(o=>{const[k,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(k)}" ${k==val?'selected':''}>${esc(l)}</option>`}).join('')}</select></label>`;
 if(f.t==='textarea')return `<label class="field"><span>${f.l}</span><textarea name="${f.n}">${esc(val)}</textarea></label>`;
 return `<label class="field"><span>${f.l}</span><input name="${f.n}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal" step="any"':''} value="${esc(val)}" placeholder="${esc(f.ph||'')}"></label>`}
function formSheet(title,fields,obj,onSave){
 const o=openOverlay(`<div class="shead"><button class="btn" data-x>Abbrechen</button><b>${title}</b><button class="btn primary" data-s>Sichern</button></div><div class="sbody"><form class="in">${fields.map(r=>Array.isArray(r)?`<div class="grid2" style="margin-bottom:10px">${r.map(f=>field(f,obj&&obj[f.n])).join('')}</div>`:`<div style="margin-bottom:10px">${field(r,obj&&obj[r.n])}</div>`).join('')}</form></div>`);
 const form=$('form',o);
 $('[data-s]',o).onclick=()=>{const v=Object.fromEntries(new FormData(form));Object.keys(v).forEach(k=>v[k]=typeof v[k]==='string'?v[k].trim():v[k]);if(onSave(v)!==false)closeOverlay(o)};
 form.onsubmit=e=>{e.preventDefault();$('[data-s]',o).click()}}
function editEnv(e){
 formSheet(e?'Zelt bearbeiten':'Neues Zelt',[
  {n:'name',l:'Name',ph:'z. B. Zelt 1',d:e?'':'Zelt '+(envs().filter(x=>x.kind!=='dry').length+1)},
  [{n:'kind',l:'Art',t:'select',noEmpty:true,o:[['grow','Growzelt'],['dry','Trockenzelt']],d:'grow'},{n:'size',l:'Größe',ph:'z. B. 100×100×200'}],
  [{n:'light',l:'Licht',t:'select',o:LIGHTS},{n:'watt',l:'Watt',t:'number'}],
  [{n:'schedule',l:'Lichtzyklus',t:'select',o:SCHEDULES},{n:'medium',l:'Medium',t:'select',o:MEDIA}],
  {n:'notes',l:'Notizen (Lüfter, Filter, Befeuchter …)',t:'textarea'}],e,v=>{
   if(!v.name){toast('Bitte einen Namen eingeben');return false}

function editPlant(p,envId){const isNew=!p;const eid=p?p.envId:envId||(envs().find(e=>e.kind!=='dry')||{}).id;
 const n0=plantsIn(eid).length+1,en=(get(eid)||{}).name||'';const short=en.replace(/^Zelt\s*/i,'Z').replace(/\s+/g,'');
 formSheet(p?'Pflanze bearbeiten':'Neue Pflanze',[
  [{n:'name',l:'Name',d:isNew?(short?short+'-':'P')+n0:''},...(isNew?[{n:'count',l:'Anzahl',t:'select',noEmpty:true,o:[1,2,3,4,5,6,8,9,10,12,16],d:1}]:[])],
  [{n:'strain',l:'Sorte',ph:'z. B. Northern Lights'},{n:'breeder',l:'Breeder / Samenbank'}],
  [{n:'ptype',l:'Typ',t:'select',o:PTYPES},{n:'pot',l:'Topf',ph:'z. B. 11 L Stofftopf'}],
  {n:'envId',l:'Zelt',t:'select',noEmpty:true,o:envs().map(e=>[e.id,e.name]),d:eid},
  ...(isNew?[[{n:'startPhase',l:'Startet in Phase',t:'select',noEmpty:true,o:PHASES.slice(0,4).map(x=>[x.k,x.l]),d:'germination'},{n:'startDate',l:'seit',t:'date',d:ymd()}]]:[]),
  {n:'notes',l:'Notizen',t:'textarea'}],p,v=>{
   const{startPhase,startDate,count,...rest}=v;if(!rest.name){toast('Bitte einen Namen eingeben');return false}
   if(!isNew){Object.assign(p,rest);put(p);render();return}
   const c=Number(count)||1,m=rest.name.match(/^(.*?)(\d+)$/);const base=m?m[1]:rest.name+' ',start=m?Number(m[2]):1;
   for(let i=0;i<c;i++){const o={id:uid(),type:'plant',created:new Date().toISOString(),archived:false,phases:{[startPhase||'germination']:startDate||ymd()},...rest};if(c>1||m)o.name=base+(start+i);put(o)}
   toast(c>1?c+' Pflanzen angelegt':'Pflanze angelegt');render()})}

/* ================= Ernte / Trocknung / Curing ================= */
function stageFlow(phase,c={}){
 const from=phase==='drying'?'flower':'drying';let cands=activePlants().filter(p=>curPhase(p).k===from);
 (c.plantIds||[]).forEach(id=>{const p=get(id);if(p&&!cands.includes(p))cands.push(p)});
 if(!cands.length){toast(phase==='drying'?'Keine Pflanze in der Blüte':'Keine Pflanze in der Trocknung');return}
 cands.sort((a,b)=>((get(a.envId)||{}).name||'').localeCompare((get(b.envId)||{}).name||'')||byName(a,b));
 const pre=new Set(c.plantIds&&c.plantIds.length?c.plantIds:cands.filter(p=>!c.envId||p.envId===c.envId).map(p=>p.id));
 const D=dryEnvs(),harvest=phase==='drying';
 const o=openOverlay(`<div class="shead"><button class="btn" data-x>Abbrechen</button><b>${harvest?'🌾 Ernten':'🫙 Ins Glas'}</b><button class="btn primary" data-s>Sichern</button></div><div class="sbody"><div class="in">
 <div class="grid2"><label class="field"><span>Datum</span><input type="date" name="date" value="${ymd()}"></label>${harvest?`<label class="field"><span>Trocknen in</span><select name="to">${D.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}<option value="">Im Zelt lassen</option></select></label>`:''}</div>
 <div class="muted small" style="margin:10px 2px">${harvest?'Wähle die Pflanzen und trag das Nassgewicht ein (optional). Sie wandern ins Trockenzelt.':'Trockengewicht eintragen (optional). Die Pflanzen wandern vom Trockenzelt in die Gläser.'}</div>
 ${cands.map(p=>{const e=get(p.envId),a=ageAt(p);return `<div class="hrow" data-pid="${p.id}"><button class="chk ${pre.has(p.id)?'on':''}">${pre.has(p.id)?'✓':''}</button><div class="grow1"><b>${esc(p.name)}</b><div class="muted tiny">${e?esc(e.name)+' · ':''}${a.ph.l} Tag ${a.pday}${p.strain?' · '+esc(p.strain):''}</div></div><input type="number" inputmode="decimal" step="any" placeholder="${harvest?'nass g':'trocken g'}" value="${harvest?(p.wet??''):(p.dry??'')}"></div>`}).join('')}
 </div></div>`);
 $$('.hrow .chk',o).forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.textContent=b.classList.contains('on')?'✓':''});
 $('[data-s]',o).onclick=()=>{const date=$('[name=date]',o).value||ymd(),to=harvest?$('[name=to]',o).value:null;let n=0;
  $$('.hrow',o).forEach(r=>{if(!$('.chk',r).classList.contains('on'))return;const p=get(r.dataset.pid),w=num($('input',r).value),old=p.envId;
   p.phases=p.phases||{};p.phases[phase]=date;if(harvest){if(w!=null)p.wet=w;if(to)p.envId=to}else{if(w!=null)p.dry=w;p.envId=null}put(p);n++;
   put({id:uid(),type:'log',envId:old,plantIds:[p.id],date:date+'T'+nowTime(),acts:['harvest','phase'],phase,harvest:harvest?(w!=null?{wet:w}:null):(w!=null?{dry:w}:null),photos:[]})});
  if(!n){toast('Keine Pflanze ausgewählt');return}closeOverlay(o);render();toast(harvest?`${n} geerntet 🌾`:`${n} im Glas 🫙`)}}

/* ================= Plus-Menü & Klima ================= */
async function plusMenu(){const c=ctx();
 const items=[['water','💧','Gießen'],['feed','🧪','Düngen'],['env','🌡️','Klima'],['photo','📷','Foto'],['train','✂️','Training'],['transplant','🪴','Umtopfen'],['measure','📏','Messen'],['problem','🐛','Problem'],['note','📝','Notiz'],['harvest','🌾','Ernten'],['task','🔔','Erinnerung'],['plant','🌱','Pflanze']];
 const choices=list=>list.map(([k,i,l])=>`<button data-k="${k}"><span>${i}</span>${l}</button>`).join('');
 const k=await dialog(`<h2 style="margin:0 0 6px">Eintrag hinzufügen</h2><p class="muted small">${c.plantIds?'Für die geöffnete Pflanze':c.envId?'Für das geöffnete Zelt':'Wähle eine Aktion. Das Zelt wählst du im nächsten Schritt.'}</p><div class="pgrid">${choices(items.filter(x=>['water','feed','env','photo','note','task'].includes(x[0])))}</div><details><summary>Weitere Aktionen</summary><div class="pgrid">${choices(items.filter(x=>!['water','feed','env','photo','note','task'].includes(x[0])))}</div></details><button class="btn block" data-k="">Abbrechen</button>`);
 if(!k)return;if(!envs().length&&k!=='task'){toast('Lege zuerst deine Zelte an');tab('garden');return}
 if(k==='env')return quickClimate(c.envId);
 if(k==='harvest')return stageFlow('drying',c);
 if(k==='task')return editTask(null,c.envId);
 if(k==='plant')return editPlant(null,c.envId&&get(c.envId).kind!=='dry'?c.envId:null);
 editLog({...c,acts:k==='note'?[]:[k]})}
function quickClimate(envId){const es=envs();if(!es.length)return;let eid=envId||es[0].id;
 const o=openOverlay(`<div class="shead"><button class="btn" data-x>Abbrechen</button><b>🌡️ Klima</b><button class="btn primary" data-s>Sichern</button></div><div class="sbody"><div class="in">
 <div class="lbl">Zelt</div><div class="chips" id="qenv">${es.map(e=>`<button class="chip ${e.id===eid?'on':''}" data-env="${e.id}">${e.kind==='dry'?'🍂':'⛺'} ${esc(e.name)}</button>`).join('')}</div>
 <div class="grid2" style="margin-top:14px">${nf('t','Temperatur °C')}${nf('h','Luftfeuchte %')}</div>
 <div class="vpd" id="qv"></div>
 <div class="grid2" style="margin-top:12px">${nf('ppfd','PPFD (optional)')}${nf('co2','CO₂ ppm (optional)')}</div>
 <div class="lbl">Notiz</div><input name="note" placeholder="optional">
 <button class="btn block" style="margin-top:16px" data-next></button></div></div>`);
 const T=$('[name=t]',o),H=$('[name=h]',o),qv=$('#qv',o),nx=$('[data-next]',o);
 const upd=()=>{const e=get(eid),ph=envPhase(e),t=num(T.value),h=num(H.value),v=vpd(t,h);
  qv.innerHTML=(v!=null&&e.kind!=='dry'?`VPD ≈ <b>${fmtN(v,2)} kPa</b> `:'')+(t!=null||h!=null?statusHTML(t,h,ph):'')+`<div class="muted tiny" style="margin-top:4px">${ph?targetText(ph):'Keine Pflanzen im Zelt – kein Zielbereich.'}</div>`;
  const i=es.findIndex(x=>x.id===eid);nx.style.display=i<es.length-1?'':'none';if(i<es.length-1)nx.textContent=`Sichern & weiter zu „${es[i+1].name}“`};
 const pick=id=>{eid=id;$$('[data-env]',o).forEach(b=>b.classList.toggle('on',b.dataset.env===id));upd()};
 $$('[data-env]',o).forEach(b=>b.onclick=()=>pick(b.dataset.env));T.oninput=upd;H.oninput=upd;upd();setTimeout(()=>T.focus(),250);
 const save=()=>{const v={temp:num(T.value),rh:num(H.value),ppfd:num($('[name=ppfd]',o).value),co2:num($('[name=co2]',o).value)};Object.keys(v).forEach(k=>v[k]==null&&delete v[k]);
  if(!Object.keys(v).length){toast('Bitte Temperatur oder Luftfeuchte eintragen');return false}
  put({id:uid(),type:'log',envId:eid,plantIds:[],date:nowLocal(),acts:['env'],env:v,note:$('[name=note]',o).value.trim(),photos:[]});return true};
 $('[data-s]',o).onclick=()=>{if(save()){closeOverlay(o);render();toast('Gespeichert')}};
 nx.onclick=()=>{if(!save())return;const i=es.findIndex(x=>x.id===eid);toast(`${get(eid).name} gespeichert`);['t','h','ppfd','co2','note'].forEach(n=>$(`[name=${n}]`,o).value='');pick(es[i+1].id);T.focus()}}

/* ================= Eintrag-Editor ================= */
function editLog(seed={}){

 <p class="muted tiny" style="margin-top:12px">Es lässt sich genau ein Konto anlegen – deins. Danach meldest du dich auf jedem weiteren Gerät nur noch an.</p></form></div>`);
 const em=$('[name=em]',o),pw=$('[name=pw]',o),btns=$$('[data-login],[data-create]',o),busy=b=>btns.forEach(x=>x.disabled=b);
 const login=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
  if(error)throw new Error(/invalid/i.test(error.message)?'E-Mail oder Passwort falsch':error.message);session=data.session;ls.set('gwj.email',em.value.trim());closeOverlay(o);await afterLogin()};
 $('[data-login]',o).onclick=async()=>{busy(true);try{await login()}catch(e){toast(e.message)}busy(false)};
 $('[data-create]',o).onclick=async()=>{if(pw.value.length<8){toast('Passwort: mindestens 8 Zeichen');return}busy(true);
  try{const r=await fetch(SB_URL+'/functions/v1/create-account',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify({email:em.value.trim(),password:pw.value})});
   const j=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(j.error==='exists'?'Es gibt schon ein Konto – bitte „Anmelden“ nutzen':j.error==='invalid_email'?'Bitte eine gültige E-Mail eingeben':j.error==='weak_password'?'Passwort: mindestens 8 Zeichen':'Konto konnte nicht erstellt werden');
   await login()}catch(e){toast(e.message)}busy(false)}}
async function afterLogin(){const local=mem.items.size>0;let cloudHas=false;
 try{const{count}=await sb.from('items').select('id',{count:'exact',head:true}).eq('deleted',false);cloudHas=count>0}catch(e){}
 if(cloudHas&&local&&ls.get('gwj.syncedUser')!==session.user.id){
  const k=await dialog(`<p><b>In der Cloud sind schon Daten – auf diesem Gerät auch.</b></p><button class="btn primary" data-k="cloud">Cloud übernehmen (Daten auf diesem Gerät verwerfen)</button><button class="btn" data-k="merge">Beides zusammenführen</button>`);
  if(k==='cloud')await clearLocal();else await enqueueAll()}
 else if(local)await enqueueAll();
 ls.set('gwj.syncedUser',session.user.id);ls.set('gwj.pullSince',null);startSync();render();toast('Cloud-Sync ist aktiv ☁️')}
async function signOut(){if(!await confirmDlg('Abmelden? Deine Daten bleiben auf diesem Gerät, werden aber nicht mehr abgeglichen.','Abmelden'))return;
 try{if(channel){sb.removeChannel(channel);channel=null}await sb.auth.signOut()}catch(e){}session=null;ls.set('gwj.syncedUser',null);render()}

/* ================= Start ================= */
(async()=>{await initStore();migrate();render();initSync();
 if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
