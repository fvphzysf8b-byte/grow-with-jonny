<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jonny">
<meta name="theme-color" content="#0f1412">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Grow with Jonny</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f1412;--card:#171e1b;--card2:#1e2723;--line:#2a3530;--text:#eaf1ec;--muted:#93a59b;--faint:#5f7068;
  --accent:#7bd389;--accentInk:#0c1a10;--warn:#f2c14e;--danger:#ef6b6b;
  --r:16px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + var(--sab));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 12px 10px;background:rgba(15,20,18,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.top.big .ttl{text-align:left;font-size:28px;padding-left:4px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--accent);flex:none}
.ib:active{background:var(--card2)}
.wrap{padding:14px 14px 0;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.row{display:flex;align-items:center;gap:10px}.grow1{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.fab{position:fixed;right:18px;bottom:calc(20px + var(--sab));z-index:30;height:56px;padding:0 22px;border-radius:28px;background:var(--accent);color:var(--accentInk);font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;gap:8px}
.fab b{font-size:24px;line-height:0}
/* grow cards */
.gcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:12px}
.gcover{height:150px;background:linear-gradient(135deg,#1d2b24,#12241a);display:grid;place-items:center;font-size:44px;position:relative}
.gcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gcover .daytag{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:4px 10px;border-radius:20px;font-size:13px;font-weight:600}
.gbody{padding:12px 14px 14px}
.gname{font-weight:700;font-size:18px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* hero */
.hero{margin:-14px -14px 0;height:200px;position:relative;background:linear-gradient(135deg,#1d2b24,#12241a);display:grid;place-items:center;font-size:56px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(15,20,18,.95))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-34px;position:relative;z-index:2}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:20px;font-weight:600;font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.quick button span{font-size:22px}
/* timeline */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px}
.dayhead b{font-size:15px}.dayhead span{font-size:12px;color:var(--muted)}
.entry{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.etop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.etime{font-weight:700;font-variant-numeric:tabular-nums}
.eicons{font-size:16px;letter-spacing:2px}
.eline{margin-top:6px;font-size:14px;color:var(--text)}
.eline .k{color:var(--muted)}
.enote{margin-top:8px;font-size:14px;color:var(--muted);white-space:pre-wrap}
.strip{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.strip img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--card2)}
/* plants */
.pcard{display:flex;width:100%;text-align:left;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
.pthumb{width:64px;height:64px;border-radius:12px;background:var(--card2);flex:none;display:grid;place-items:center;font-size:28px;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pname{font-weight:700}
.phasebar{display:flex;gap:3px;margin-top:12px}
.phasebar div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.phaselabels{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:4px}
/* gallery */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 -14px}
.gallery button{aspect-ratio:1;position:relative;overflow:hidden;background:var(--card2)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery span{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:600;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:8px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;margin-top:10px}
.chartcard h3{margin:0 0 8px;font-size:15px}
.chartbox{height:200px;position:relative}
/* tasks */
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:6px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);flex:none;display:grid;place-items:center;font-size:14px;color:var(--accentInk)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.due{font-size:12px;color:var(--muted)}.due.late{color:var(--danger)}
/* sheet */
.overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.shead{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 12px 10px;border-bottom:1px solid var(--line)}
.shead b{flex:1;text-align:center}
.shead .btn{padding:8px 14px}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(40px + var(--sab))}
.sbody .in{max-width:640px;margin:0 auto}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:16px 2px 6px}
.lbl:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field span{display:block;font-size:12px;color:var(--muted);margin:0 2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:rgba(123,211,137,.16);border-color:var(--accent);color:var(--accent)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.act span{font-size:22px}
.act.on{border-color:var(--accent);background:rgba(123,211,137,.12);color:var(--accent)}
.sec{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px}
.sec.on{display:block}
.sec h4{margin:0 0 10px;font-size:15px}
.nrow{display:grid;grid-template-columns:1fr 90px 36px;gap:6px;margin-bottom:6px}
.vpd{margin-top:8px;font-size:14px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.photos .ph{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--card2)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);font-size:13px;display:grid;place-items:center}
.addph{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--faint);display:grid;place-items:center;font-size:26px;color:var(--muted);cursor:pointer}
/* dialogs */
.dlgbg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + var(--sab))}
.dlg{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;animation:up .18s ease}
.dlg p{margin:0 0 14px;text-align:center}
.dlg .btn{width:100%;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sab));z-index:300;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;max-width:90vw}
.lb{position:fixed;inset:0;z-index:250;background:#000;display:flex;flex-direction:column}
.lb .imgw{flex:1;display:grid;place-items:center;overflow:hidden}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .bar{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) 12px 8px}
.lb .cap{flex:1;text-align:center;font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:52px;margin-bottom:8px}
.banner{background:rgba(242,193,78,.12);border:1px solid rgba(242,193,78,.4);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv .k{color:var(--muted)}
.plist{display:flex;gap:4px;flex-wrap:wrap}
.menu .btn{justify-content:flex-start}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ Konstanten ============ */
const PHASES=[
 {k:'germination',l:'Keimung',c:'#c9a46a',i:'🫘'},
 {k:'seedling',l:'Sämling',c:'#9be08f',i:'🌱'},
 {k:'veg',l:'Wachstum',c:'#4fbf6b',i:'🌿'},
 {k:'flower',l:'Blüte',c:'#d68be0',i:'🌸'},
 {k:'drying',l:'Trocknung',c:'#e0a85a',i:'🍂'},
 {k:'curing',l:'Curing',c:'#b8875a',i:'🫙'},
 {k:'done',l:'Fertig',c:'#8fa198',i:'✅'}];
const PH=Object.fromEntries(PHASES.map(p=>[p.k,p]));
const ACTS=[
 {k:'water',l:'Gießen',i:'💧'},{k:'feed',l:'Düngen',i:'🧪'},{k:'env',l:'Klima',i:'🌡️'},{k:'measure',l:'Messen',i:'📏'},
 {k:'training',l:'Training',i:'✂️'},{k:'phase',l:'Phase',i:'🔄'},{k:'problem',l:'Problem',i:'🐛'},{k:'harvest',l:'Ernte',i:'⚖️'}];
const ACT=Object.fromEntries(ACTS.map(a=>[a.k,a]));
const TRAININGS=['Topping','FIM','LST','HST','Supercropping','Entlauben','Lollipopping','SCROG','SOG','Mainlining','Umtopfen','Stecklinge genommen','Spülen'];
const PROBLEMS=['Stickstoffmangel','Kaliummangel','Magnesiummangel','Calciummangel','Überdüngung','Überwässerung','Unterwässerung','Lichtstress','Hitzestress','Spinnmilben','Thripse','Trauermücken','Blattläuse','Mehltau','Schimmel / Botrytis','Wurzelfäule','pH-Problem'];
const ENVS=['Indoor','Outdoor','Gewächshaus'];
const MEDIA=['Erde','Living Soil','Coco','Hydro (DWC)','Steinwolle','Aeroponik','Sonstiges'];
const LIGHTS=['LED','HPS / NDL','CMH / LEC','Leuchtstoff / CFL','Sonne','Gemischt'];
const PTYPES=['Photoperiodisch (feminisiert)','Autoflower','Regulär','Steckling / Klon'];
const SERIES=['#3987e5','#d95926','#199e70','#c98500','#d55181','#0ca30c','#9085e9','#e66767'];

/* ============ Helfer ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const z2=n=>String(n).padStart(2,'0');
const ymd=(d=new Date())=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const nowLocal=()=>{const d=new Date();return ymd(d)+'T'+z2(d.getHours())+':'+z2(d.getMinutes())};
const utc=s=>{const[y,m,d]=s.slice(0,10).split('-').map(Number);return Date.UTC(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((utc(b)-utc(a))/864e5);
const fmtDay=s=>new Date(s.slice(0,10)+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short',year:s.slice(0,4)==String(new Date().getFullYear())?undefined:'numeric'});
const fmtShort=s=>new Date(s.slice(0,10)+'T12:00').toLocaleDateString('de-DE',{day:'numeric',month:'short'});
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmtN=(n,d=1)=>n==null?'–':(Math.round(n*10**d)/10**d).toLocaleString('de-DE');
const ago=s=>{const d=dayDiff(s,ymd());return d<=0?'heute':d==1?'gestern':'vor '+d+' Tagen'};

/* ============ Speicher (IndexedDB, lokal auf dem Gerät) ============ */
const mem={items:new Map(),photos:new Map()};let idb=null,storeOK=false;
function openDB(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('growbuch',1)}catch(e){return rej(e)}
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function req(store,mode,op){return new Promise((res,rej)=>{if(!idb)return res(undefined);try{const r=op(idb.transaction(store,mode).objectStore(store));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function initStore(){
 try{idb=await openDB();const all=await req('items','readonly',s=>s.getAll());(all||[]).forEach(o=>mem.items.set(o.id,o));storeOK=true;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 }catch(e){idb=null;storeOK=false}
}
const saveErr=e=>toast('Speichern fehlgeschlagen'+(e&&e.name==='QuotaExceededError'?': Speicher voll':''));
function put(o){o.updated=Date.now();mem.items.set(o.id,o);return req('items','readwrite',s=>s.put(o)).catch(saveErr)}
function del(id){mem.items.delete(id);return req('items','readwrite',s=>s.delete(id)).catch(saveErr)}
async function putPhoto(blob,id=uid()){mem.photos.set(id,blob);await req('photos','readwrite',s=>s.put(blob,id)).catch(saveErr);return id}
function delPhoto(id){mem.photos.delete(id);const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}return req('photos','readwrite',s=>s.delete(id)).catch(()=>{})}
async function getPhoto(id){let b=mem.photos.get(id);if(!b){b=await req('photos','readonly',s=>s.get(id)).catch(()=>null);if(b)mem.photos.set(id,b)}return b}
const urlCache=new Map();
async function photoURL(id){if(urlCache.has(id))return urlCache.get(id);const b=await getPhoto(id);if(!b)return'';const u=URL.createObjectURL(b);urlCache.set(id,u);return u}
function hydrate(root=document){$$('img[data-ph]',root).forEach(async im=>{const u=await photoURL(im.dataset.ph);if(u)im.src=u;else im.remove()})}
const img=(id,attrs='')=>id?`<img data-ph="${esc(id)}" alt="" ${attrs}>`:'';

/* Bilder verkleinern, damit der Speicher reicht */
function shrink(file,max=1600,q=.82){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Bild')),'image/jpeg',q)};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Bild konnte nicht gelesen werden'))};im.src=u})}

/* ============ Datenzugriff ============ */
const all=t=>[...mem.items.values()].filter(o=>o.type===t);
const get=id=>mem.items.get(id);
const grows=()=>all('grow').sort((a,b)=>(b.start||'').localeCompare(a.start||''));
const plantsOf=gid=>all('plant').filter(p=>p.growId===gid).sort((a,b)=>(a.created||'').localeCompare(b.created||''));
const entriesOf=gid=>all('entry').filter(e=>e.growId===gid).sort((a,b)=>b.date.localeCompare(a.date));
const entriesOfPlant=pid=>all('entry').filter(e=>(e.plantIds||[]).includes(pid)).sort((a,b)=>b.date.localeCompare(a.date));
const tasksOf=gid=>all('task').filter(t=>t.growId===gid);
const growDay=(g,at=ymd())=>dayDiff(g.start||ymd(),at)+1;
function curPhase(p){for(let i=PHASES.length-1;i>=0;i--)if(p.phases&&p.phases[PHASES[i].k])return PHASES[i];return PHASES[0]}
function plantStart(p){for(const ph of PHASES)if(p.phases&&p.phases[ph.k])return p.phases[ph.k];return (p.created||ymd()).slice(0,10)}
function plantAge(p){const end=(p.phases&&(p.phases.drying||p.phases.done))||ymd();const d=Math.max(0,dayDiff(plantStart(p),end));const ph=curPhase(p);
 const pd=Math.max(0,dayDiff((p.phases&&p.phases[ph.k])||plantStart(p),ymd()));return{day:d+1,week:Math.floor(d/7)+1,ph,pday:pd+1,pweek:Math.floor(pd/7)+1}}
function photosOf(list){const out=[];list.forEach(e=>(e.photos||[]).forEach(id=>out.push({id,date:e.date,growId:e.growId})));return out}
function coverOf(gid){const e=entriesOf(gid).find(e=>e.photos&&e.photos.length);return e?e.photos[0]:null}
function plantCover(pid){const e=entriesOfPlant(pid).find(e=>e.photos&&e.photos.length);return e?e.photos[0]:null}
function vpd(t,rh){if(t==null||rh==null)return null;const svp=x=>.6108*Math.exp(17.27*x/(x+237.3));return Math.max(0,svp(t-2)-svp(t)*rh/100)}
function harvestOf(gid){let wet=0,dry=0;entriesOf(gid).forEach(e=>{if(e.harvest){wet+=e.harvest.wet||0;dry+=e.harvest.dry||0}});return{wet,dry}}
function nutrientNames(){const s=new Set();all('entry').forEach(e=>(e.nutrients||[]).forEach(n=>n.name&&s.add(n.name)));return[...s].sort()}

/* ============ Navigation ============ */
let R={v:'home'};const hist=[];
function go(r){hist.push(R);R=r;render();window.scrollTo(0,0)}
function back(){R=hist.pop()||{v:'home'};render()}
const charts=[];
function render(){
 charts.splice(0).forEach(c=>{try{c.destroy()}catch(e){}});
 const app=$('#app');
 if(R.v==='grow'&&!get(R.id))R={v:'home'};
 if(R.v==='plant'&&!get(R.id))R={v:'home'};
 app.innerHTML=R.v==='grow'?vGrow():R.v==='plant'?vPlant():R.v==='settings'?vSettings():vHome();
 hydrate(app);
 if(R.after){const f=R.after;R.after=null;f()}
 if((R.v==='grow'||R.v==='plant')&&R.tab==='stats')drawCharts();
}

 let h=`<header class="top big"><div class="ttl">Grow with Jonny</div><button class="ib" onclick="go({v:'settings'})" aria-label="Einstellungen">⚙︎</button></header><div class="wrap">`;
 if(!storeOK)h+=`<div class="banner">Speichern ist in dieser Ansicht nicht möglich. Öffne die App in Safari und installiere sie (Teilen → „Zum Home-Bildschirm“), dann bleiben deine Daten erhalten.</div>`;
 if(!gs.length)h+=`<div class="empty"><div class="big">🌱</div><div style="font-size:20px;font-weight:700;color:var(--text)">Dein erster Grow</div><p>Leg einen Grow an, füge Pflanzen hinzu und dokumentiere jeden Tag: Gießen, Dünger, Klima, Training und Fotos.</p><button class="btn primary" onclick="editGrow()">Grow anlegen</button></div>`;

function phasePills(plants){const c={};plants.forEach(p=>{const k=curPhase(p).k;c[k]=(c[k]||0)+1});
 return PHASES.filter(p=>c[p.k]).map(p=>`<span class="pill"><i style="background:${p.c}"></i>${c[p.k]}× ${p.l}</span>`).join('')}
function growCard(g){const ps=plantsOf(g.id),es=entriesOf(g.id),cov=coverOf(g.id);
 return `<button class="gcard" onclick="go({v:'grow',id:'${g.id}',tab:'log'})"><div class="gcover">${cov?img(cov):'🪴'}<span class="daytag">${g.archived?'Abgeschlossen':'Tag '+growDay(g)+' · Woche '+Math.ceil(growDay(g)/7)}</span></div>
 <div class="gbody"><div class="gname">${esc(g.name)}</div><div class="muted small">${[g.env,g.medium,g.light].filter(Boolean).map(esc).join(' · ')}</div>
 <div class="pills">${phasePills(ps)}<span class="pill">${ps.length} Pflanze${ps.length==1?'':'n'}</span>${es.length?`<span class="pill">Letzter Eintrag ${ago(es[0].date)}</span>`:''}</div></div></button>`}

/* ============ Grow ============ */
function vGrow(){
 const g=get(R.id),ps=plantsOf(g.id),es=entriesOf(g.id),cov=coverOf(g.id),hv=harvestOf(g.id);const tab=R.tab||'log';
 let h=`<header class="top"><button class="ib" onclick="back()">‹</button><div class="ttl">${esc(g.name)}</div><button class="ib" onclick="growMenu()">⋯</button></header><div class="wrap">

 <div class="stats"><div class="stat"><b>${growDay(g)}</b><span>Tag</span></div><div class="stat"><b>${ps.length}</b><span>Pflanzen</span></div><div class="stat"><b>${es.length}</b><span>Einträge</span></div><div class="stat"><b>${hv.dry?fmtN(hv.dry,0):'–'}</b><span>g trocken</span></div></div>
 <div class="pills" style="margin-top:12px">${[g.env,g.medium,g.light,g.watt?g.watt+' W':'',g.space].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}<span class="pill">Start ${fmtShort(g.start)}</span></div>`;
 if(!g.archived)h+=`<div class="quick">${['water','feed','env','photo'].map(k=>`<button onclick="editEntry({growId:'${g.id}',acts:['${k}']})"><span>${k=='photo'?'📷':ACT[k].i}</span>${k=='photo'?'Foto':ACT[k].l}</button>`).join('')}</div>`;

function tabs(list,on){return `<div class="tabs">${list.map(([k,l])=>`<button class="tab ${k==on?'on':''}" onclick="R.tab='${k}';render()">${l}</button>`).join('')}</div>`}
function plantCard(p){const a=plantAge(p),cov=plantCover(p.id);
 return `<button class="pcard" onclick="go({v:'plant',id:'${p.id}',tab:'log'})"><div class="pthumb">${cov?img(cov):a.ph.i}</div><div class="grow1"><div class="pname">${esc(p.name)}</div><div class="muted small">${esc(p.strain||'Unbekannte Sorte')}${p.breeder?' · '+esc(p.breeder):''}</div>
 <div class="pills"><span class="pill"><i style="background:${a.ph.c}"></i>${a.ph.l} · Tag ${a.pday}</span><span class="pill">Tag ${a.day} · W${a.week}</span></div></div><span class="muted">›</span></button>`}
function timeline(es,g){
 if(!es.length)return `<div class="empty"><div class="big">📓</div>Noch keine Einträge. Tippe auf „+ Eintrag“ oder nutze die Schnellaktionen.</div>`;
 let h='',last='';
 es.forEach(e=>{const d=e.date.slice(0,10);if(d!==last){last=d;const gg=get(e.growId);const gd=gg?growDay(gg,d):0;h+=`<div class="dayhead"><b>${fmtDay(d)}</b><span>${gd>0?'Tag '+gd+' · Woche '+Math.ceil(gd/7):gg?'vor Start':''}</span></div>`}h+=entryCard(e)});
 return h;
}
function entryLines(e){const L=[];const k=(a)=>`<span class="k">${a}</span>`;
 if(e.water){const w=e.water,p=[];if(w.amount!=null)p.push(fmtN(w.amount,2)+' L');if(w.ph!=null)p.push('pH '+fmtN(w.ph,2));if(w.ec!=null)p.push('EC '+fmtN(w.ec,2));if(w.temp!=null)p.push(fmtN(w.temp)+' °C');
  if(w.rph!=null||w.rec!=null)p.push(k('Runoff')+' '+[w.rph!=null?'pH '+fmtN(w.rph,2):'',w.rec!=null?'EC '+fmtN(w.rec,2):''].filter(Boolean).join(' '));L.push('💧 '+(p.join(' · ')||'Gegossen'))}
 if(e.nutrients&&e.nutrients.length)L.push('🧪 '+e.nutrients.map(n=>esc(n.name)+(n.dose!=null?' '+k(fmtN(n.dose,2)+' ml/L'):'')).join(', '));
 if(e.env){const v=e.env,p=[];if(v.temp!=null)p.push(fmtN(v.temp)+' °C');if(v.rh!=null)p.push(fmtN(v.rh,0)+' % RLF');const vp=vpd(v.temp,v.rh);if(vp!=null)p.push('VPD '+fmtN(vp,2)+' kPa');if(v.light!=null)p.push(fmtN(v.light,1)+' h Licht');if(v.ppfd!=null)p.push(fmtN(v.ppfd,0)+' PPFD');if(v.co2!=null)p.push(fmtN(v.co2,0)+' ppm CO₂');if(v.dist!=null)p.push('Abstand '+fmtN(v.dist,0)+' cm');if(p.length)L.push('🌡️ '+p.join(' · '))}
 if(e.height!=null)L.push('📏 Höhe '+fmtN(e.height)+' cm');
 if(e.training&&e.training.length)L.push('✂️ '+e.training.map(esc).join(', '));
 if(e.phase)L.push('🔄 Phase → <b>'+(PH[e.phase]?PH[e.phase].l:esc(e.phase))+'</b>');
 if(e.problems&&e.problems.length)L.push('🐛 '+e.problems.map(esc).join(', '));
 if(e.harvest){const p=[];if(e.harvest.wet)p.push('nass '+fmtN(e.harvest.wet,0)+' g');if(e.harvest.dry)p.push('trocken '+fmtN(e.harvest.dry,0)+' g');if(p.length)L.push('⚖️ '+p.join(' · '))}
 return L}
function entryIcons(e){return (e.acts||[]).map(a=>ACT[a]?ACT[a].i:'').join('')+((e.photos||[]).length?'📷':'')+(e.note?'📝':'')}
function entryCard(e){const ps=(e.plantIds||[]).map(get).filter(Boolean);
 return `<button class="entry" onclick="editEntry(get('${e.id}'))"><div class="etop"><span class="etime">${e.date.slice(11,16)}</span><span class="eicons">${entryIcons(e)}</span><span class="grow1"></span>${R.v==='grow'?`<span class="plist">${ps.length&&ps.length===plantsOf(e.growId).length&&ps.length>1?'<span class="pill">Alle Pflanzen</span>':ps.map(p=>`<span class="pill">${esc(p.name)}</span>`).join('')}</span>`:''}</div>
 ${entryLines(e).map(l=>`<div class="eline">${l}</div>`).join('')}${e.note?`<div class="enote">${esc(e.note)}</div>`:''}
 ${(e.photos||[]).length?`<div class="strip">${e.photos.map(id=>img(id)).join('')}</div>`:''}</button>`}
function gallery(list,g){
 if(!list.length)return `<div class="empty"><div class="big">📷</div>Noch keine Fotos.</div>`;
 window._lb=list.map(p=>({id:p.id,cap:fmtDay(p.date)+(get(p.growId)?' · Tag '+growDay(get(p.growId),p.date.slice(0,10)):'')}));

/* ============ Statistik ============ */
function statsView(g,es,ps){
 const waters=es.filter(e=>e.water),waterL=waters.reduce((s,e)=>s+(e.water.amount||0),0),hv=harvestOf(g.id);
 const gpw=hv.dry&&g.watt?hv.dry/g.watt:null;
 let h=`<div style="height:14px"></div><div class="tiles">
 <div class="tile"><b>${waters.length}</b><span>Gießvorgänge</span></div><div class="tile"><b>${fmtN(waterL,1)} L</b><span>Wasser gesamt</span></div>
 <div class="tile"><b>${hv.dry?fmtN(hv.dry,0)+' g':'–'}</b><span>Ernte trocken${hv.wet?' (nass '+fmtN(hv.wet,0)+' g)':''}</span></div><div class="tile"><b>${gpw!=null?fmtN(gpw,2):'–'}</b><span>g pro Watt</span></div></div>`;
 if(!window.Chart)return h+`<div class="card muted small" style="margin-top:10px">Diagramme brauchen beim ersten Start eine Internetverbindung.</div>`;
 const defs=chartDefs(g,es,ps);
 if(!defs.length)return h+`<div class="empty">Sobald du pH, EC, Klima oder Höhe einträgst, erscheinen hier Verläufe.</div>`;
 window._cd=defs;
 return h+defs.map((d,i)=>`<div class="chartcard"><h3>${d.title}</h3><div class="chartbox"><canvas id="ch${i}" role="img" aria-label="${esc(d.title)}"></canvas></div></div>`).join('');
}
function chartDefs(g,es,ps){
 const asc=[...es].reverse(),day=e=>growDay(g,e.date.slice(0,10));
 const ser=(label,f,ci=0)=>({label,data:asc.map(e=>({x:day(e),y:f(e)})).filter(p=>p.y!=null),color:SERIES[ci]});
 const defs=[],add=(title,unit,sets,type='line')=>{sets=sets.filter(s=>s.data.length);if(sets.length)defs.push({title,unit,sets,type})};
 add('pH','',[ser('Gießwasser',e=>e.water&&e.water.ph,0),ser('Runoff',e=>e.water&&e.water.rph,1)]);
 add('EC (mS/cm)','mS/cm',[ser('Gießwasser',e=>e.water&&e.water.ec,0),ser('Runoff',e=>e.water&&e.water.rec,1)]);
 add('Temperatur (°C)','°C',[ser('Luft',e=>e.env&&e.env.temp,0)]);
 add('Luftfeuchte (% RLF)','%',[ser('RLF',e=>e.env&&e.env.rh,0)]);
 add('VPD (kPa)','kPa',[ser('VPD',e=>e.env?vpd(e.env.temp,e.env.rh):null,0)]);
 add('Höhe (cm)','cm',ps.map((p,i)=>({label:p.name,color:SERIES[i%SERIES.length],data:asc.filter(e=>e.height!=null&&(e.plantIds||[]).includes(p.id)).map(e=>({x:day(e),y:e.height}))})));
 const byDay={};asc.forEach(e=>{if(e.water&&e.water.amount!=null){const d=day(e);byDay[d]=(byDay[d]||0)+e.water.amount}});
 add('Wassermenge pro Tag (L)','L',[{label:'Wasser',color:SERIES[0],data:Object.entries(byDay).map(([x,y])=>({x:+x,y}))}],'bar');
 return defs}
function drawCharts(){if(!window.Chart||!window._cd)return;const css=getComputedStyle(document.documentElement);const muted=css.getPropertyValue('--muted').trim(),grid='rgba(255,255,255,.06)',text=css.getPropertyValue('--text').trim();
 window._cd.forEach((d,i)=>{const cv=document.getElementById('ch'+i);if(!cv)return;
  charts.push(new Chart(cv,{type:d.type,data:{datasets:d.sets.map(s=>({label:s.label,data:s.data,borderColor:s.color,backgroundColor:s.color,pointBackgroundColor:s.color,pointBorderColor:'#171e1b',pointBorderWidth:2,borderWidth:2,tension:.25,pointRadius:4,pointHoverRadius:7,borderRadius:4,barThickness:10}))},
  options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'nearest',intersect:false},
   scales:{x:{type:'linear',ticks:{color:muted,precision:0,callback:v=>'T'+v},grid:{color:grid},border:{color:grid}},y:{ticks:{color:muted},grid:{color:grid},border:{display:false},beginAtZero:d.type==='bar'}},
   plugins:{legend:{display:d.sets.length>1,labels:{color:text,usePointStyle:true,boxWidth:8,boxHeight:8}},tooltip:{backgroundColor:'#0b0f0d',borderColor:'#2a3530',borderWidth:1,titleColor:text,bodyColor:text,callbacks:{title:it=>'Tag '+it[0].parsed.x,label:it=>`${it.dataset.label}: ${fmtN(it.parsed.y,2)} ${d.unit}`}}}}}))})}

/* ============ Aufgaben ============ */

 return `<div class="task ${t.done?'done':''}"><button class="chk ${t.done?'on':''}" onclick="toggleTask('${t.id}')" aria-label="Erledigt">${t.done?'✓':''}</button><div class="grow1"><div class="tt">${esc(t.title)}</div><div class="due ${late?'late':''}">${t.due?(late?'Überfällig · ':'')+fmtDay(t.due):'Ohne Datum'}${R.v==='home'&&g?' · '+esc(g.name):''}</div></div><button class="ib" style="color:var(--faint);font-size:16px" onclick="delTask('${t.id}')" aria-label="Löschen">✕</button></div>`}

 <div class="phasebar">${PHASES.map((x,i)=>`<div style="background:${i<=ci?x.c:''}"></div>`).join('')}</div><div class="phaselabels">${PHASES.map(x=>`<span>${x.l.slice(0,4)}</span>`).join('')}</div>
 ${ci<PHASES.length-1&&!g.archived?`<button class="btn block" style="margin-top:12px" onclick="nextPhase('${p.id}')">${PHASES[ci+1].i} Weiter zu „${PHASES[ci+1].l}“</button>`:''}</div>`;

 if(tab==='info'){const hvs=es.filter(e=>e.harvest);const dry=hvs.reduce((s,e)=>s+(e.harvest.dry||0),0);

function setPhaseDate(pid,k,v){const p=get(pid);p.phases=p.phases||{};if(v)p.phases[k]=v;else delete p.phases[k];put(p);toast('Gespeichert')}
async function nextPhase(pid){const p=get(pid),ci=PHASES.indexOf(curPhase(p)),nx=PHASES[ci+1];if(!nx)return;
 if(!await confirmDlg(`${esc(p.name)} ab heute in „${nx.l}“?`,'Phase wechseln'))return;
 p.phases=p.phases||{};p.phases[nx.k]=ymd();put(p);
 put({id:uid(),type:'entry',growId:p.growId,plantIds:[p.id],date:nowLocal(),acts:['phase'],phase:nx.k,photos:[],created:new Date().toISOString()});render()}

async function growMenu(){const g=get(R.id);const k=await sheetMenu([['edit','Grow bearbeiten'],['arch',g.archived?'Wieder aktivieren':'Grow abschließen (archivieren)'],['del','Grow löschen','danger']]);

 if(k==='arch'){g.archived=!g.archived;put(g);render()}
 if(k==='del'&&await confirmDlg(`„${esc(g.name)}“ mit allen Pflanzen, Einträgen und Fotos endgültig löschen?`,'Löschen',true)){
  for(const e of entriesOf(g.id)){(e.photos||[]).forEach(delPhoto);del(e.id)}plantsOf(g.id).forEach(p=>del(p.id));tasksOf(g.id).forEach(t=>del(t.id));del(g.id);R={v:'home'};hist.length=0;render()}}
async function plantMenu(){const p=get(R.id);const k=await sheetMenu([['edit','Pflanze bearbeiten'],['del','Pflanze löschen','danger']]);
 if(k==='edit')editPlant(p);
 if(k==='del'&&await confirmDlg(`„${esc(p.name)}“ löschen? Einträge, die nur diese Pflanze betreffen, werden mitgelöscht.`,'Löschen',true)){
  entriesOfPlant(p.id).forEach(e=>{e.plantIds=e.plantIds.filter(x=>x!==p.id);if(!e.plantIds.length){(e.photos||[]).forEach(delPhoto);del(e.id)}else put(e)});del(p.id);back()}}

/* ============ Formulare (Grow / Pflanze) ============ */
function field(f,v){const val=v??f.d??'';
 if(f.t==='select')return `<label class="field"><span>${f.l}</span><select name="${f.n}"><option value="">–</option>${f.o.map(o=>`<option ${o==val?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
 if(f.t==='textarea')return `<label class="field"><span>${f.l}</span><textarea name="${f.n}">${esc(val)}</textarea></label>`;
 return `<label class="field"><span>${f.l}</span><input name="${f.n}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal" step="any"':''} value="${esc(val)}" ${f.req?'required':''} placeholder="${esc(f.ph||'')}"></label>`}
function formSheet(title,fields,obj,onSave){
 const o=openOverlay(`<div class="shead"><button class="btn" data-x>Abbrechen</button><b>${title}</b><button class="btn primary" data-s>Sichern</button></div><div class="sbody"><form class="in">${fields.map(r=>Array.isArray(r)?`<div class="grid2" style="margin-bottom:10px">${r.map(f=>field(f,obj&&obj[f.n])).join('')}</div>`:`<div style="margin-bottom:10px">${field(r,obj&&obj[r.n])}</div>`).join('')}</form></div>`);
 const form=$('form',o);
 $('[data-s]',o).onclick=()=>{if(!form.reportValidity())return;const v=Object.fromEntries(new FormData(form));Object.keys(v).forEach(k=>v[k]=typeof v[k]==='string'?v[k].trim():v[k]);onSave(v);closeOverlay(o)};
 form.onsubmit=e=>{e.preventDefault();$('[data-s]',o).click()};
}
function editGrow(g){
 formSheet(g?'Grow bearbeiten':'Neuer Grow',[
  {n:'name',l:'Name',req:true,ph:'z. B. Zelt 1 · Winter 2026'},
  {n:'start',l:'Startdatum',t:'date',d:ymd(),req:true},
  [{n:'env',l:'Umgebung',t:'select',o:ENVS,d:'Indoor'},{n:'medium',l:'Medium',t:'select',o:MEDIA}],
  [{n:'light',l:'Licht',t:'select',o:LIGHTS},{n:'watt',l:'Leistung (Watt)',t:'number'}],
  {n:'space',l:'Fläche / Zelt',ph:'z. B. 80×80×180 cm'},
  {n:'notes',l:'Notizen',t:'textarea'}],g,v=>{
   const o=g||{id:uid(),type:'grow',created:new Date().toISOString(),archived:false};Object.assign(o,v,{watt:num(v.watt)});put(o);
   if(!g){go({v:'grow',id:o.id,tab:'plants'});setTimeout(()=>editPlant(null,o.id),250)}else render()})}
function editPlant(p,gid){
 const isNew=!p;
 formSheet(p?'Pflanze bearbeiten':'Neue Pflanze',[
  {n:'name',l:'Name',req:true,ph:'z. B. Pflanze 1',d:isNew?'Pflanze '+(plantsOf(gid).length+1):''},
  [{n:'strain',l:'Sorte',ph:'z. B. Northern Lights'},{n:'breeder',l:'Breeder / Samenbank'}],
  [{n:'ptype',l:'Typ',t:'select',o:PTYPES},{n:'pot',l:'Topf',ph:'z. B. 11 L Stofftopf'}],
  ...(isNew?[[{n:'startPhase',l:'Startet in Phase',t:'select',o:PHASES.slice(0,4).map(x=>x.l),d:'Keimung'},{n:'startDate',l:'seit',t:'date',d:ymd()}]]:[]),
  {n:'notes',l:'Notizen',t:'textarea'}],p,v=>{
   const o=p||{id:uid(),type:'plant',growId:gid,created:new Date().toISOString(),phases:{}};
   const{startPhase,startDate,...rest}=v;Object.assign(o,rest);
   if(isNew){const ph=PHASES.find(x=>x.l===startPhase)||PHASES[0];o.phases[ph.k]=startDate||ymd()}
   put(o);render()})}

/* ============ Eintrag-Editor ============ */
function editEntry(seed){
 const ex=seed&&seed.id?seed:null;const growId=seed.growId,g=get(growId),ps=plantsOf(growId);
 const e=ex?JSON.parse(JSON.stringify(ex)):{growId,date:nowLocal(),plantIds:seed.plantIds||ps.filter(p=>!['drying','curing','done'].includes(curPhase(p).k)).map(p=>p.id),acts:(seed.acts||[]).filter(a=>a!=='photo'),photos:[],nutrients:[]};
 if(!ex&&!e.plantIds.length)e.plantIds=ps.map(p=>p.id);
 const W=e.water||{},V=e.env||{},H=e.harvest||{};const sel=new Set(e.plantIds),acts=new Set(e.acts),photos=[...(e.photos||[])],removed=[],added=[];
 const nf=(n,l,v,ph='')=>`<label class="field"><span>${l}</span><input name="${n}" type="number" inputmode="decimal" step="any" value="${v??''}" placeholder="${ph}"></label>`;
 const nrow=(n={})=>`<div class="nrow"><input name="nname" list="nutlist" placeholder="Dünger / Zusatz" value="${esc(n.name||'')}"><input name="ndose" type="number" inputmode="decimal" step="any" placeholder="ml/L" value="${n.dose??''}"><button type="button" class="ib" style="color:var(--faint);font-size:16px" data-rm>✕</button></div>`;
 const lastFeed=entriesOf(growId).find(x=>x.nutrients&&x.nutrients.length&&(!ex||x.id!==ex.id));
 const o=openOverlay(`<div class="shead"><button class="btn" data-x>Abbrechen</button><b>${ex?'Eintrag bearbeiten':'Neuer Eintrag'}</b><button class="btn primary" data-s>Sichern</button></div>
 <div class="sbody"><div class="in">
  <div class="lbl">Datum & Uhrzeit</div><input type="datetime-local" name="date" value="${esc(e.date)}">
  ${ps.length?`<div class="lbl">Pflanzen</div><div class="chips" id="pchips"><button class="chip" data-all>Alle</button>${ps.map(p=>`<button class="chip ${sel.has(p.id)?'on':''}" data-pid="${p.id}">${esc(p.name)}</button>`).join('')}</div>`:`<div class="banner" style="margin-top:12px">Dieser Grow hat noch keine Pflanzen. Der Eintrag gilt für den ganzen Grow.</div>`}
  <div class="lbl">Was hast du gemacht?</div><div class="acts">${ACTS.map(a=>`<button class="act ${acts.has(a.k)?'on':''}" data-act="${a.k}"><span>${a.i}</span>${a.l}</button>`).join('')}</div>
  <div class="sec" data-sec="water"><h4>💧 Gießen</h4><div class="grid3">${nf('w_amount','Menge (L)',W.amount)}${nf('w_ph','pH',W.ph)}${nf('w_ec','EC (mS/cm)',W.ec)}</div><div class="grid3" style="margin-top:8px">${nf('w_temp','Wasser °C',W.temp)}${nf('w_rph','Runoff pH',W.rph)}${nf('w_rec','Runoff EC',W.rec)}</div></div>
  <div class="sec" data-sec="feed"><h4>🧪 Dünger & Zusätze</h4><div id="nrows">${(e.nutrients&&e.nutrients.length?e.nutrients:[{}]).map(nrow).join('')}</div><div class="row"><button type="button" class="btn" data-addn>+ Zeile</button>${lastFeed?`<button type="button" class="btn" data-lastn>Wie zuletzt</button>`:''}</div><datalist id="nutlist">${nutrientNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
  <div class="sec" data-sec="env"><h4>🌡️ Klima & Licht</h4><div class="grid3">${nf('v_temp','Temp. °C',V.temp)}${nf('v_rh','RLF %',V.rh)}${nf('v_light','Licht h/Tag',V.light,'18')}</div><div class="grid3" style="margin-top:8px">${nf('v_ppfd','PPFD',V.ppfd)}${nf('v_co2','CO₂ ppm',V.co2)}${nf('v_dist','Abstand cm',V.dist)}</div><div class="vpd muted" id="vpdout"></div></div>
  <div class="sec" data-sec="measure"><h4>📏 Messen</h4><div class="grid2">${nf('height','Höhe (cm)',e.height)}</div></div>
  <div class="sec" data-sec="training"><h4>✂️ Training</h4><div class="chips" data-multi="training">${TRAININGS.map(t=>`<button class="chip ${(e.training||[]).includes(t)?'on':''}" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
  <div class="sec" data-sec="phase"><h4>🔄 Phasenwechsel</h4><select name="phase">${PHASES.map(x=>`<option value="${x.k}" ${(e.phase||(ps[0]?PHASES[Math.min(PHASES.length-1,PHASES.indexOf(curPhase(ps.find(p=>sel.has(p.id))||ps[0]))+1)].k:''))===x.k?'selected':''}>${x.i} ${x.l}</option>`).join('')}</select><div class="muted small" style="margin-top:6px">Setzt bei den gewählten Pflanzen das Startdatum dieser Phase auf das Eintragsdatum.</div></div>
  <div class="sec" data-sec="problem"><h4>🐛 Probleme</h4><div class="chips" data-multi="problems">${PROBLEMS.map(t=>`<button class="chip ${(e.problems||[]).includes(t)?'on':''}" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
  <div class="sec" data-sec="harvest"><h4>⚖️ Ernte</h4><div class="grid2">${nf('h_wet','Nassgewicht (g)',H.wet)}${nf('h_dry','Trockengewicht (g)',H.dry)}</div><div class="muted small" style="margin-top:6px">Trockengewicht kannst du später nachtragen, indem du diesen Eintrag bearbeitest.</div></div>
  <div class="lbl">Fotos</div><div class="photos" id="phs"></div>
  <div class="lbl">Notiz</div><textarea name="note" placeholder="Beobachtungen, Geruch, Blattfarbe…">${esc(e.note||'')}</textarea>
  ${ex?`<button class="btn danger block" style="margin-top:20px" data-del>Eintrag löschen</button>`:''}
 </div></div>`);
 const secs=()=>$$('.sec',o).forEach(s=>s.classList.toggle('on',acts.has(s.dataset.sec)));secs();
 $$('[data-act]',o).forEach(b=>b.onclick=()=>{const k=b.dataset.act;acts.has(k)?acts.delete(k):acts.add(k);b.classList.toggle('on');secs()});
 $$('[data-pid]',o).forEach(b=>b.onclick=()=>{const id=b.dataset.pid;sel.has(id)?sel.delete(id):sel.add(id);b.classList.toggle('on')});
 const allB=$('[data-all]',o);if(allB)allB.onclick=()=>{const on=sel.size!==ps.length;sel.clear();if(on)ps.forEach(p=>sel.add(p.id));$$('[data-pid]',o).forEach(b=>b.classList.toggle('on',on))};
 $$('[data-multi] .chip',o).forEach(b=>b.onclick=()=>b.classList.toggle('on'));
 const nrows=$('#nrows',o);const bindRm=()=>$$('[data-rm]',nrows).forEach(b=>b.onclick=()=>b.parentElement.remove());bindRm();
 $('[data-addn]',o).onclick=()=>{nrows.insertAdjacentHTML('beforeend',nrow());bindRm()};
 const ln=$('[data-lastn]',o);if(ln)ln.onclick=()=>{nrows.innerHTML=lastFeed.nutrients.map(nrow).join('');bindRm()};
 const vo=$('#vpdout',o),upV=()=>{const v=vpd(num($('[name=v_temp]',o).value),num($('[name=v_rh]',o).value));vo.innerHTML=v==null?'VPD wird aus Temperatur und RLF berechnet (Blatt 2 °C kühler).':`VPD ≈ <b style="color:var(--text)">${fmtN(v,2)} kPa</b> ${v<.4?'· sehr niedrig':v<.8?'· gut für Sämlinge/Stecklinge':v<1.2?'· gut für Wachstum':v<1.6?'· gut für Blüte':'· zu hoch'}`};
 $('[name=v_temp]',o).oninput=upV;$('[name=v_rh]',o).oninput=upV;upV();
 const phs=$('#phs',o);
 const drawPh=()=>{phs.innerHTML=photos.map((id,i)=>`<div class="ph">${img(id)}<button class="x" data-i="${i}">✕</button></div>`).join('')+`<label class="addph">＋<input type="file" accept="image/*" multiple hidden></label>`;hydrate(phs);
  $$('.x',phs).forEach(b=>b.onclick=()=>{const[id]=photos.splice(+b.dataset.i,1);removed.push(id);drawPh()});
  $('input',phs).onchange=async ev=>{const fs=[...ev.target.files];if(!fs.length)return;toast(fs.length>1?fs.length+' Fotos werden verarbeitet…':'Foto wird verarbeitet…');
   for(const f of fs){try{const b=await shrink(f);const id=await putPhoto(b);photos.push(id);added.push(id)}catch(err){toast(err.message)}}drawPh()}};
 drawPh();
 if(seed.acts&&seed.acts.includes('photo'))setTimeout(()=>{const i=$('input[type=file]',phs);i&&i.click()},300);
 $('[data-x]',o).onclick=()=>{added.forEach(delPhoto);closeOverlay(o)};
 const d=$('[data-del]',o);if(d)d.onclick=async()=>{if(!await confirmDlg('Diesen Eintrag mit Fotos löschen?','Löschen',true))return;[...photos,...removed].forEach(delPhoto);del(ex.id);closeOverlay(o);render()};
 $('[data-s]',o).onclick=()=>{
  const val=n=>{const el=$(`[name=${n}]`,o);return el?num(el.value):null};
  const out={id:ex?ex.id:uid(),type:'entry',growId,created:ex?ex.created:new Date().toISOString(),date:$('[name=date]',o).value||nowLocal(),plantIds:[...sel],acts:[...acts],photos,note:$('[name=note]',o).value.trim()};
  const pack=obj=>{Object.keys(obj).forEach(k=>obj[k]==null&&delete obj[k]);return Object.keys(obj).length?obj:null};
  if(acts.has('water'))out.water=pack({amount:val('w_amount'),ph:val('w_ph'),ec:val('w_ec'),temp:val('w_temp'),rph:val('w_rph'),rec:val('w_rec')})||{};
  if(acts.has('feed'))out.nutrients=$$('.nrow',o).map(r=>({name:$('[name=nname]',r).value.trim(),dose:num($('[name=ndose]',r).value)})).filter(n=>n.name);
  if(acts.has('env'))out.env=pack({temp:val('v_temp'),rh:val('v_rh'),light:val('v_light'),ppfd:val('v_ppfd'),co2:val('v_co2'),dist:val('v_dist')});
  if(acts.has('measure')){const h=val('height');if(h!=null)out.height=h}
  if(acts.has('training'))out.training=$$('[data-multi=training] .chip.on',o).map(b=>b.dataset.v);
  if(acts.has('problem'))out.problems=$$('[data-multi=problems] .chip.on',o).map(b=>b.dataset.v);
  if(acts.has('harvest'))out.harvest=pack({wet:val('h_wet'),dry:val('h_dry')});
  if(acts.has('phase')){out.phase=$('[name=phase]',o).value;sel.forEach(pid=>{const p=get(pid);p.phases=p.phases||{};p.phases[out.phase]=out.date.slice(0,10);put(p)})}
  if(!out.acts.length&&!out.photos.length&&!out.note){toast('Wähle eine Aktivität, ein Foto oder eine Notiz');return}
  removed.forEach(delPhoto);put(out);closeOverlay(o);if(R.v!=='home')R.tab='log';render();toast('Gespeichert')};
}

/* ============ Einstellungen / Backup ============ */
function vSettings(){
 R.after=()=>{if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(s=>{const el=$('#stor');if(el&&s.usage!=null)el.textContent+=` Belegt: ${fmtN(s.usage/1048576,1)} MB.`}).catch(()=>{})};
 return `<header class="top"><button class="ib" onclick="back()">‹</button><div class="ttl">Einstellungen</div><span class="ib"></span></header><div class="wrap">
 <div class="h2">Auf dem iPhone installieren</div><div class="card small">In <b>Safari</b> öffnen → <b>Teilen</b> (Quadrat mit Pfeil) → <b>„Zum Home-Bildschirm“</b>. Danach startet Grow with Jonny wie eine App im Vollbild und funktioniert auch offline.</div>
 <div class="h2">Speicher</div><div class="card small"><div id="stor">${storeOK?'Alle Daten und Fotos liegen nur auf diesem Gerät.':'Speichern ist hier nicht verfügbar.'}</div><div class="muted" style="margin-top:6px">Wichtig: Wenn du die App löschst oder Safari-Websitedaten löschst, sind die Daten weg. Mach regelmäßig ein Backup.</div></div>
 <div class="h2">Backup</div><div class="card"><button class="btn primary block" onclick="exportData()">Backup exportieren</button><label class="btn block" style="margin-top:8px">Backup importieren<input type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])"></label><div class="muted small" style="margin-top:8px">Das Backup enthält alle Grows, Einträge und Fotos in einer Datei. Speichere sie in „Dateien“ oder iCloud Drive.</div></div>
 <div class="h2">Gefahrenzone</div><div class="card"><button class="btn danger block" onclick="wipe()">Alle Daten löschen</button></div>
 <p class="muted tiny" style="text-align:center;margin:24px 0">Grow with Jonny · ${all('grow').length} Grows · ${all('entry').length} Einträge</p></div>`}
function blobToB64(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
async function exportData(){
 toast('Backup wird erstellt…');const items=[...mem.items.values()];const ids=new Set();items.forEach(o=>(o.photos||[]).forEach(id=>ids.add(id)));
 const photos={};for(const id of ids){const b=await getPhoto(id);if(b)photos[id]=await blobToB64(b)}
 const blob=new Blob([JSON.stringify({app:'growbuch',version:1,exported:new Date().toISOString(),items,photos})],{type:'application/json'});
 const name='grow-with-jonny-backup-'+ymd()+'.json';
 try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Grow with Jonny Backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
async function importData(file){if(!file)return;try{const d=JSON.parse(await file.text());if(d.app!=='growbuch'||!Array.isArray(d.items))throw new Error();
 if(!await confirmDlg(`Backup mit ${d.items.filter(o=>o.type==='grow').length} Grows und ${Object.keys(d.photos||{}).length} Fotos importieren? Vorhandene Daten bleiben erhalten, gleiche Einträge werden überschrieben.`,'Importieren'))return;
 for(const[id,b64]of Object.entries(d.photos||{})){const b=await (await fetch(b64)).blob();await putPhoto(b,id)}
 for(const o of d.items){mem.items.set(o.id,o);await req('items','readwrite',s=>s.put(o)).catch(saveErr)}toast('Import abgeschlossen');R={v:'home'};hist.length=0;render()}catch(e){toast('Datei ist kein gültiges Backup')}}
async function wipe(){if(!await confirmDlg('Wirklich ALLE Grows, Einträge und Fotos von diesem Gerät löschen?','Alles löschen',true))return;
 mem.items.clear();mem.photos.clear();await req('items','readwrite',s=>s.clear()).catch(()=>{});await req('photos','readwrite',s=>s.clear()).catch(()=>{});R={v:'home'};hist.length=0;render()}

/* ============ UI-Bausteine ============ */
function openOverlay(html){const o=document.createElement('div');o.className='overlay';o.innerHTML=html;document.body.appendChild(o);document.body.style.overflow='hidden';const x=$('[data-x]',o);if(x&&!x.onclick)x.onclick=()=>closeOverlay(o);return o}
function closeOverlay(o){o.remove();if(!$('.overlay'))document.body.style.overflow=''}
function dialog(inner){return new Promise(res=>{const bg=document.createElement('div');bg.className='dlgbg';bg.innerHTML=`<div class="dlg">${inner}</div>`;document.body.appendChild(bg);
 bg.onclick=e=>{const b=e.target.closest('[data-k]');if(b||e.target===bg){bg.remove();res(b?b.dataset.k:null)}}})}
async function confirmDlg(text,ok,danger){return(await dialog(`<p>${text}</p><button class="btn ${danger?'danger':'primary'}" data-k="ok">${ok}</button><button class="btn" data-k="no">Abbrechen</button>`))==='ok'}
function sheetMenu(opts){return dialog(`<div class="menu">${opts.map(([k,l,c])=>`<button class="btn ${c||''}" data-k="${k}">${l}</button>`).join('')}<button class="btn" data-k="">Abbrechen</button></div>`)}
let tt;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;clearTimeout(tt);tt=setTimeout(()=>t.remove(),2200)}
function lightbox(list,i){const o=document.createElement('div');o.className='lb';document.body.appendChild(o);
 const draw=async()=>{o.innerHTML=`<div class="bar"><button class="ib" data-c>✕</button><div class="cap">${esc(list[i].cap)}</div><span class="tiny muted">${i+1}/${list.length}</span></div><div class="imgw"><img alt=""></div><div class="bar" style="padding-bottom:calc(10px + var(--sab))"><button class="btn grow1" data-p ${i?'':'disabled'}>‹ Zurück</button><button class="btn grow1" data-n ${i<list.length-1?'':'disabled'}>Weiter ›</button></div>`;
  $('img',o).src=await photoURL(list[i].id);$('[data-c]',o).onclick=()=>o.remove();$('[data-p]',o).onclick=()=>{if(i>0){i--;draw()}};$('[data-n]',o).onclick=()=>{if(i<list.length-1){i++;draw()}}};
 let sx=null;o.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});o.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){if(dx<0&&i<list.length-1)i++;else if(dx>0&&i>0)i--;else return;draw()}sx=null});draw()}

/* ============ Start ============ */
(async()=>{await initStore();render();
 if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
